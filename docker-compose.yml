# Локальная разработка: Postgres + медиа-стек (MinIO + imgproxy). Приложение — `npm run dev`.
# Медиа: оригиналы лежат в S3-совместимом MinIO, imgproxy отдаёт подписанные
# трансформации на лету. В проде MinIO меняется на Selectel S3 (+ CDN перед imgproxy)
# правкой S3_ENDPOINT/креды и CDN_URL — тот же код и подписи.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sethub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sethub}
      POSTGRES_DB: ${POSTGRES_DB:-sethub}
    ports:
      - '${DB_PORT:-5435}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sethub} -d ${POSTGRES_DB:-sethub}']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-совместимое хранилище оригиналов (локальный аналог Selectel).
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-sethub}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-sethubsecret}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - miniodata:/data

  # Создаёт бакет при старте (идемпотентно) и выходит.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-sethub}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-sethubsecret}
      S3_BUCKET: ${S3_BUCKET:-sethub}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY}; do echo waiting for minio; sleep 1; done;
      mc mb -p local/$${S3_BUCKET} || true;
      echo bucket ready; "

  # Трансформации изображений на лету по подписанным URL (как img.devon-pro.ru).
  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v3.31.0
    restart: unless-stopped
    depends_on:
      - minio
    environment:
      IMGPROXY_USE_S3: 'true'
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      IMGPROXY_S3_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-sethub}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-sethubsecret}
      IMGPROXY_ALLOWED_SOURCES: s3://${S3_BUCKET:-sethub}/
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      IMGPROXY_ENABLE_WEBP_DETECTION: 'true'
      IMGPROXY_MAX_SRC_RESOLUTION: '50'
      # CORS: без Access-Control-Allow-Origin браузер «портит» canvas при ре-кропе
      # уже сохранённого аватара (toBlob падает). '*' достаточно для анонимных запросов.
      IMGPROXY_ALLOW_ORIGIN: ${IMGPROXY_ALLOW_ORIGIN:-*}
    ports:
      - '${IMGPROXY_PORT:-8081}:8080'

  # Свой почтовый сервер — Stalwart (Rust MTA/IMAP/JMAP), без сторонних сервисов.
  # ОПЦИОНАЛЬНО, выключен по умолчанию (profile "mail") — почта необязательна.
  # Включить: `docker compose --profile mail up -d`.
  # Первый старт печатает пароль администратора в логах:
  #   docker compose logs mail | grep -i password
  # Настройка домена / DKIM / TLS / аккаунта — веб-админка на http://localhost:8080.
  # Затем в приложении: /admin → Почта → host=mail, port=587, user/pass созданного
  # аккаунта, TLS выкл (внутри docker-сети). Тест-письмо — кнопкой там же.
  mail:
    image: stalwartlabs/stalwart:v0.16.11 # репо переименован из mail-server; latest у mail-server больше нет
    profiles: ['mail']
    restart: unless-stopped
    volumes:
      - stalwartdata:/opt/stalwart
    ports:
      - '${SMTP_PORT:-587}:587'
      - '${MAIL_ADMIN_PORT:-8080}:8080'

  # ── Полный стек в контейнерах (обычный `docker compose up --build`). ──
  # Для чистого dev по-прежнему проще `npm run dev` + `db:up` (эти сервисы не мешают).
  # git-ядро (Rust) собирается из соседнего чекаута ../setfork-core.
  core:
    build: { context: ../setfork-core, target: runtime }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sethub}:${POSTGRES_PASSWORD:-sethub}@db:5432/${POSTGRES_DB:-sethub}
      SETFORK_CORE_ADDR: 0.0.0.0:50051
      GIT_DATA_DIR: /data/git
    ports:
      - '${CORE_PORT:-50051}:50051'
    volumes:
      - gitdata:/data/git
    depends_on:
      db: { condition: service_healthy }

  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sethub}:${POSTGRES_PASSWORD:-sethub}@db:5432/${POSTGRES_DB:-sethub}
    depends_on:
      db: { condition: service_healthy }
    restart: 'no'

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sethub}:${POSTGRES_PASSWORD:-sethub}@db:5432/${POSTGRES_DB:-sethub}
      SETFORK_CORE_URL: '1' # remote-режим: фронт зовёт Rust-ядро
      SETFORK_CORE_ADDR: core:50051
      S3_ENDPOINT: http://minio:9000 # в контейнере медиа-хосты — по именам сервисов
      SMTP_HOST: ${SMTP_HOST:-mail} # встроенный Stalwart (нужна разовая настройка, см. сервис mail)
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-SetFork <no-reply@setfork.local>}
    ports:
      - '${APP_PORT:-3000}:3000'
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      core: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
  gitdata:
  stalwartdata:
