# RU-EGRESS: мост наружу для развёртывания НА РОССИЙСКОМ ХОСТЕ.
#
# OpenRouter отдаёт 403 на российский IP, поэтому его домен резолвится в свой сервер
# вне РФ с TCP-passthrough (SNI сквозной, TLS не расшивается — ключ моста не видит).
#
# Оверлеем, а не строкой в docker-compose.dokploy.yml: адрес моста зависит от места
# развёртывания, и «дефолт» здесь опаснее отсутствия. Пока он стоял дефолтом в общем
# файле, канон переехал вне РФ, мост списали — и все вызовы модели молча уходили в
# мёртвый IP (см. комментарий у сервиса app).
#
# Подключается ТРЕТЬИМ файлом, после серверного override (в нём traefik-роутинг):
#
#   RU_EGRESS_IP=<ip моста> \
#   docker compose -f docker-compose.dokploy.yml \
#                  -f docker-compose.override.yml \
#                  -f docker-compose.ru-egress.yml up -d --build
#
# Переменная обязательна: без неё compose остановится с этим сообщением, а не поднимет
# контейнер с пустым или чужим адресом.
services:
  app:
    extra_hosts:
      - 'openrouter.ai:${RU_EGRESS_IP:?задай RU_EGRESS_IP — адрес egress-моста; без РФ-хоста этот файл не подключают}'
