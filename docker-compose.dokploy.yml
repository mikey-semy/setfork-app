# Полный деплой SetFork в Dokploy: Postgres + git-ядро (Rust) + миграции + фронт (Next).
# Всё в общей сети dokploy-network. Медиа (S3/imgproxy) — внешние (Selectel), задаётся через .env.
#
# core собирается из соседнего чекаута ../setfork-core — при деплое оба репо должны быть рядом
# (моно-чекаут). Иначе деплойте core отдельно его же setfork-core/docker-compose.dokploy.yml,
# уберите здесь сервис `core` и оставьте SETFORK_CORE_ADDR=setfork-core:50051.
#
# Traefik-роутинг на `app` (домен, порт 3000) настраивается ярлыками Dokploy в UI — тут портов нет.
services:
  # ВАЖНО: имя сервиса УНИКАЛЬНОЕ (setfork-db), НЕ generic `db`. Compose добавляет
  # имя сервиса сетевым алиасом в общую внешнюю dokploy-network. Если назвать `db`,
  # этот алиас перехватит подключения ДРУГИХ проектов, которые тоже ходят на хост
  # `db` (у них своя БД в своей сети) → их приложения попадут в наш Postgres и упадут.
  setfork-db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sethub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sethub}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sethub} -d ${POSTGRES_DB:-sethub}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [dokploy-network]

  # git-ядро (Rust) деплоится ОТДЕЛЬНЫМ проектом Dokploy из репо setfork-core
  # (setfork-core/docker-compose.dokploy.yml) → контейнер `setfork-core` в общей
  # сети dokploy-network. Здесь его НЕ собираем (иначе Dokploy ищет ../setfork-core,
  # которого в single-repo чекауте нет). Фронт зовёт его по имени контейнера:
  # SETFORK_CORE_ADDR=setfork-core:50051 (см. сервис app). Том git-объектов и
  # DATABASE_URL ядра живут в ЕГО проекте.

  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sethub}:${POSTGRES_PASSWORD}@setfork-db:5432/${POSTGRES_DB:-sethub}
    depends_on:
      setfork-db: { condition: service_healthy }
    restart: 'no'
    networks: [dokploy-network]

  # Трансформации изображений на лету по подписанным URL. Читает ОРИГИНАЛЫ из
  # внешнего S3 (Selectel) — те же креды, что у приложения. Наружу отдаётся через
  # CDN (Selectel CDN → сюда как origin); прямой доступ защищён подписью (KEY/SALT).
  # Порт 8081 — публичный origin для CDN; закройте фаерволом всё, кроме CDN, если можно.
  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v3.31.0
    restart: always
    environment:
      IMGPROXY_USE_S3: 'true'
      IMGPROXY_S3_ENDPOINT: ${S3_ENDPOINT} # https://s3.ru-3.storage.selcloud.ru
      IMGPROXY_S3_REGION: ${S3_REGION}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      IMGPROXY_ALLOWED_SOURCES: s3://${S3_BUCKET}/
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      IMGPROXY_ENABLE_WEBP_DETECTION: 'true'
      IMGPROXY_MAX_SRC_RESOLUTION: '50'
      # CORS для ре-кропа аватара через canvas (см. основной compose). В проде можно
      # сузить до конкретного origin (https://setfork.ru) через .env IMGPROXY_ALLOW_ORIGIN.
      IMGPROXY_ALLOW_ORIGIN: ${IMGPROXY_ALLOW_ORIGIN:-*}
    ports:
      - '${IMGPROXY_PORT:-8081}:8080'
    networks: [dokploy-network]

  # Свой почтовый сервер — Stalwart (Rust MTA). ОПЦИОНАЛЬНО и ВЫКЛЮЧЕН по умолчанию
  # (profile "mail"): почта в приложении и так необязательна (пустой SMTP = отключена),
  # поэтому mail НЕ должен блокировать деплой фронта. Включить, когда будете настраивать:
  #   docker compose --profile mail up -d
  # Разовая настройка после первого старта:
  #   1) пароль админа из логов: `docker compose logs mail | grep -i password`;
  #   2) веб-админка на :8080 (закройте фаерволом/после настройки) — добавьте домен,
  #      сгенерируйте DKIM, привяжите TLS-сертификат, создайте аккаунт для приложения;
  #   3) DNS домена: A/AAAA на mail, MX → mail, SPF/DKIM/DMARC + PTR (reverse-DNS);
  #   4) в приложении /admin → Почта: host=mail, port=587, user/pass аккаунта.
  mail:
    image: stalwartlabs/stalwart:v0.16.11 # репо переименован из mail-server; latest у mail-server больше нет
    profiles: ['mail'] # не поднимается при обычном `up`; включить --profile mail
    restart: always
    volumes:
      - stalwart:/opt/stalwart
    ports:
      - '25:25' # входящая почта (MX)
      - '587:587' # submission (STARTTLS)
      - '465:465' # submission (implicit TLS)
      - '8080:8080' # веб-админка (закрыть после настройки)
    networks: [dokploy-network]

  app:
    build: { context: ., target: runner }
    container_name: setfork-frontend
    restart: always
    # RU-ЕGRESS: OpenRouter отдаёт 403 на российский IP, поэтому его домен резолвится в
    # свой сервер с TCP-passthrough (SNI сквозной, TLS не расшивается). Это ЗДЕСЬ, а не
    # в серверном docker-compose.override.yml: тот файл в репозитории не лежит, compose
    # с явным `-f` его не подхватывает, и работал он лишь потому, что контейнер долго не
    # пересоздавали. Первый же нормальный деплой мост потерял — и админка показала
    # «каталог моделей не загрузился (403)», будто дело в ключе.
    #
    # Адрес переопределяется переменной в .env сервера; не задан — берётся нынешний мост.
    extra_hosts:
      - 'openrouter.ai:${RU_EGRESS_IP:-45.152.22.222}'
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sethub}:${POSTGRES_PASSWORD}@setfork-db:5432/${POSTGRES_DB:-sethub}
      SETFORK_CORE_URL: '1' # включить remote-режим git-ядра
      SETFORK_CORE_ADDR: setfork-core:50051 # контейнер ядра из отдельного проекта setfork-core
      SETFORK_CORE_TOKEN: ${SETFORK_CORE_TOKEN:-} # Bearer-токен канала (тот же в проекте ядра)
      # Rate-limit: пусто → in-memory (1 инстанс). Для >1 реплики задай REDIS_URL и
      # подними профиль scale (redis-сервис ниже): лимит станет общим на все инстансы.
      REDIS_URL: ${REDIS_URL:-}
    depends_on:
      setfork-db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [dokploy-network]

  # Redis для общего rate-limit при ГОРИЗОНТАЛЬНОМ масштабе (>1 реплики app).
  # На одном инстансе НЕ нужен (in-memory быстрее, без сети) — profile scale держит
  # его выключенным по умолчанию. Включить: docker compose --profile scale up -d,
  # и задать REDIS_URL=redis://setfork-redis:6379.
  redis:
    image: redis:7-alpine
    container_name: setfork-redis
    profiles: ['scale']
    restart: always
    command: ['redis-server', '--maxmemory', '128mb', '--maxmemory-policy', 'allkeys-lru', '--save', '']
    networks: [dokploy-network]

  # Бэкап Postgres → S3 (те же Selectel-креды, что у медиа). Единственный хост:
  # потеря диска = потеря всего, поэтому бэкап ОБЯЗАН быть offsite (в объектном S3),
  # а не в локальный том. Ежедневный pg_dump, ротация BACKUP_KEEP_DAYS.
  # ⚠️ После первого деплоя ОБЯЗАТЕЛЬНО проверь: (1) в логах db-backup успешный дамп;
  #    (2) объект появился в бакете; (3) сделай ТЕСТОВЫЙ restore на пустую БД.
  #    Runbook: setfork-docs/internal/runbooks/backups.md
  db-backup:
    image: eeshugerman/postgres-backup-s3:16
    restart: always
    environment:
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      S3_ENDPOINT: ${S3_ENDPOINT} # полный URL со схемой (как у медиа)
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${BACKUP_S3_BUCKET:-${S3_BUCKET}}
      S3_PREFIX: ${BACKUP_S3_DB_PREFIX:-setfork/db}
      POSTGRES_HOST: setfork-db
      POSTGRES_DATABASE: ${POSTGRES_DB:-sethub}
      POSTGRES_USER: ${POSTGRES_USER:-sethub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PASSPHRASE: ${BACKUP_PASSPHRASE:-} # если задан — дамп GPG-шифруется (restore требует его)
    depends_on:
      setfork-db: { condition: service_healthy }
    networks: [dokploy-network]

volumes:
  pgdata:
  stalwart:

networks:
  dokploy-network:
    external: true
