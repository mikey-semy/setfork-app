syntax = "proto3";

// SetFork git-core — контракт провода Rust↔Next (Connect/gRPC).
// Каноничная копия — sethub-app/proto/git.proto. Соответствует @/core GitCore.

package setfork.git.v1;

message RepoRef {
  string owner = 1;
  string slug = 2;
}

message InfoRefsRequest {
  RepoRef repo = 1;
  string git_protocol = 2;
}

message PostRequest {
  RepoRef repo = 1;
  bytes body = 2;
  string git_protocol = 3;
  // И2: язык человека для текстов, которые он прочитает ПРЯМО из вывода
  // `git push` — их печатает pre-receive, и переводить их некому: между ядром
  // и клиентом никого нет. Определяет фронт (профиль пользователя, иначе
  // Accept-Language), ядро лишь передаёт значение процессу receive-pack
  // переменной окружения, а хук её читает. '' → английский.
  string lang = 4;
  // ПЕРЕХОДНОЕ ПОЛЕ, живёт до выката Ф5 на прод.
  //
  // До Ф5 здесь ехал ник, и по нему ядро называло ветку правки. Ф5 перешла на
  // неизменный идентификатор — но номер поля под новый смысл переиспользовать
  // нельзя: номер обязан значить одно и то же всегда, иначе в окно выкатки ник
  // приедет под видом идентификатора.
  //
  // Просто убрать поле тоже нельзя: фронт и ядро выкатываются порознь, и в окно
  // между выкатками СТАРОЕ ядро (Ф4) читает ник именно отсюда. Без него оно
  // отвергает `refs/for/main` с «непонятно, кто пушит» — то есть рабочая функция
  // ложится на всё время выкатки, и порядок тут не спасает: при обратном порядке
  // ложится ровно так же, только на другой стороне (авто-ревью fe#662).
  //
  // Поэтому канонический переход protobuf: новое поле рядом со старым, фронт
  // пишет ОБА, старое ядро читает своё, новое — своё. После выката Ф5 поле
  // удаляется, номер уходит в reserved. Хвост записан в трек git-surface.
  //
  // Ядро с Ф5 читает это поле ТОЛЬКО когда `actor_id` пуст, то есть когда фронт
  // ещё старый. Иначе обратный порядок выкатки (ядро раньше фронта) ронял бы
  // магический пуш точно так же — просто на другой стороне. В логике ник не
  // участвует и здесь: он лишь называет ветку, ровно как называл до Ф5.
  string actor_handle = 5;
  // Ф4: НЕИЗМЕННЫЙ идентификатор пушащего — нужен магическому рефу
  // `refs/for/<base>`: коммиты кладутся в его ветку `u/<id>/<base>`. Ядро
  // пользователей не знает, значение приходит от фронта, который пуш уже
  // авторизовал. '' → магический реф отвергается хуком с объяснением.
  //
  // ⚠️ Именно идентификатор, а НЕ ник. Ник сменяем и после смены достаётся
  // другому человеку, а имя ветки живёт вечно: с ником в имени новый владелец
  // ника попадал бы в чужую ветку и переписывал чужое предложение. У Gerrit и
  // GitHub ветки вклада (`refs/changes/…`, `refs/pull/N/head`) по той же причине
  // не именуются ником вовсе.
  string actor_id = 7;
  // Ф5: роль пушащего — 'owner' | 'collaborator' | 'contributor'.
  //
  // РЕШАЕТ фронт: владение, соавторство, `prSettings.allowFrom`, модерация — это
  // пользовательская авторизация, и по ADR-0011 §2 её место там. Ядро исполняет
  // МЕХАНИЧЕСКОЕ следствие роли: посторонний предъявляет правку ТОЛЬКО через
  // `refs/for/main` и не пишет никаких веток напрямую — как у Gerrit, где вклад
  // приходит одним магическим рефом, а имя ветки придумывает сервер.
  //
  // '' означает «фронт старше Ф5»: он ролей не шлёт — и посторонних не впускает,
  // поэтому ограничивать нечего. Ядро пишет об этом в лог, чтобы состояние окна
  // выкатки не было тихим.
  string actor_role = 6;
}

message BytesResponse {
  bytes data = 1;
}

// Ф4: что сделал магический пуш `refs/for/<base>` — «это не ветка, это
// предложение к base» (приём Gerrit). Ядро кладёт коммиты в ветку автора и
// сообщает сюда; ПРЕДЛОЖЕНИЕ создаёт фронт: нумерация, уведомления, аудит и
// модерация живут там, ядро о них не знает.
message MagicPush {
  string base = 1;     // к чему предлагают (пока только main)
  string branch = 2;   // куда легли коммиты: u/<id>/<base> (имя придумал сервер)
  string tip_sha = 3;
}

message ReceivePackResponse {
  bytes data = 1;
  int32 new_version = 2;
  // Пусто у обычного пуша. Несколько записей — если в одном пуше несколько
  // магических рефов (технически возможно, продуктово странно, но молчать о
  // части из них нельзя).
  repeated MagicPush magic = 3;
}

// ── Как читать отказ ────────────────────────────────────────────────────────
// Причина отказа едет ТРЕЙЛЕРОМ `sf-reason`, значение — UPPER_SNAKE_CASE
// (AIP-193): CONFLICT, NOTHING_TO_MERGE, STALE, NOT_FOUND, PROTECTED, FROZEN,
// ARCHIVED, BAD_NAME, EXISTS, …
//
// Клиент обязан смотреть на ПРИЧИНУ, а не на текст сообщения и не на код gRPC:
//   • текст английский и человеческий, он для логов и отладки, меняется свободно;
//   • код gRPC ГРУБЕЕ причины — под FailedPrecondition их четыре, под
//     InvalidArgument две, и по коду отказы неразличимы.
// Набор причин сверяется между репозиториями гейтом (scripts/check-proto-sync.sh),
// поэтому переименование значения = поломка клиента, а добавление нового — нет.
service GitCore {
  // Ф5: возможности ядра — см. CapabilitiesResponse. Читается ДО авторизации
  // постороннего, поэтому дешёвый и без побочных действий.
  rpc GetCapabilities(CapabilitiesRequest) returns (CapabilitiesResponse);
  rpc InfoRefsUploadPack(InfoRefsRequest) returns (BytesResponse);
  rpc InfoRefsReceivePack(InfoRefsRequest) returns (BytesResponse);
  rpc UploadPack(PostRequest) returns (BytesResponse);
  rpc ReceivePack(PostRequest) returns (ReceivePackResponse);
  rpc CreateBundle(RepoRef) returns (BytesResponse);
  // Ветки (фаза A: read-only срез). main — канон, прочие — черновики без проекции.
  rpc ListBranches(RepoRef) returns (BranchesResponse);
  rpc GetBranchSnapshot(BranchSnapshotRequest) returns (BranchSnapshotResponse);
  // A2: управление ветками. Ошибки — gRPC-статусами: invalid_argument (имя),
  // already_exists, not_found, failed_precondition (main защищён от удаления).
  rpc CreateBranch(CreateBranchRequest) returns (BranchOpResponse);
  rpc DeleteBranch(DeleteBranchRequest) returns (BranchOpResponse);
  // A3: merge ветки в main (ff или merge-commit) + проекция новой версии.
  // Отказы (причина — в трейлере, см. выше): CONFLICT (не сливается чисто),
  // NOTHING_TO_MERGE (ветка не впереди main), NOT_FOUND, BAD_NAME.
  // ⚠️ new_version = 0 в ответе означает «проекция НЕ легла», а не «версии нет»:
  // слияние в git прошло, а Postgres о нём ещё не знает. Показывать это как
  // «версии нет» — значит погасить сигнал; выравнивание чинится sync-repos.
  rpc MergeBranch(MergeBranchRequest) returns (MergeBranchResponse);
  // A4: вход конфликтного merge — три материализации для трёхстороннего
  // сравнения по шагам (base = merge-base, ours = main, theirs = ветка).
  rpc GetMergeState(MergeStateRequest) returns (MergeStateResponse);
  // A4: merge c ручным резолвом — клиент присылает ФИНАЛЬНЫЙ list.json.
  // Дерево результата = дерево main c заменённым list.json и БЕЗ steps/
  // (md-оверрайды сбрасываются: канон разрешённых шагов — list.json).
  // Коммит с двумя родителями (main, ветка) → main → проекция версии.
  rpc MergeResolved(MergeResolvedRequest) returns (MergeBranchResponse);
  // Теги релизов: CreateTag ставит git-тег name на коммит версии (тег vN уже
  // есть у каждой версии), чтобы clone привозил и человекочитаемый тег релиза.
  rpc CreateTag(CreateTagRequest) returns (BranchOpResponse); // tip_sha = коммит тега
  // ListTags — интроспекция (сверка releases-БД ↔ git-теги при инцидентах,
  // grpcurl через reflection); UI-потребителя нет и не планируется (HQ ADR-0012).
  rpc ListTags(RepoRef) returns (TagsResponse);
  // Ф3: пуш зеркала СЕЙЧАС (кнопка «Синхронизировать» и после сохранения
  // настроек). Исход — в теле (ok/error), НЕ gRPC-ошибкой: текст ошибки —
  // легитимный ответ для показа владельцу. Фоновые пуши после записи main
  // ядро делает само, этот RPC для ручного толчка.
  rpc MirrorPush(RepoRef) returns (MirrorPushResponse);
  // Ф2: проверка доступа к зеркалу БЕЗ пуша — кнопка «Проверить доступ», чтобы
  // владелец узнал о неверном токене сразу, а не после первой публикации.
  //
  // ⚠️ Проверяется именно ЗАПИСЬ. `git ls-remote` для этого не годится: на
  // публичном репозитории он отвечает успехом даже с заведомо мусорным токеном
  // (проверено на живом GitHub — exit 0), и кнопка давала бы зелёный там, где
  // пуш откажет. У read-only токена так и будет.
  rpc MirrorCheck(RepoRef) returns (MirrorCheckResponse);
  // A5: обновить ветку из main (ОБРАТНОЕ слияние). Нужно, когда main ушёл вперёд:
  // без этого единственный выход из расхождения — ручной резолвер конфликтов,
  // хотя обычно достаточно влить main в ветку. main не двигается → проекции нет.
  // Ошибки как у MergeBranch: 'conflict' | 'nothing-to-merge' | not_found.
  rpc UpdateBranch(UpdateBranchRequest) returns (UpdateBranchResponse);
  // Коммиты рефа — вкладка «Коммиты» у правки: что именно принесла ветка.
  // not_in скрывает достижимое из базы (обычно main), поэтому вернётся ровно
  // тот набор, который уйдёт в main при слиянии.
  rpc ListCommits(ListCommitsRequest) returns (CommitsResponse);
  // Записать list.json в ВЕТКУ одним коммитом. Нужно «предложенным правкам»:
  // рецензент даёт готовый текст пункта, автор жмёт «Применить» — и правка
  // ложится в ветку предложения, а не требует локального клона.
  //
  // MergeResolved пишет в main, здесь main НЕ трогается: ветка — черновик,
  // версии рождаются только из main, поэтому проекции нет.
  //
  // expected_tip — оптимистичная блокировка: между чтением ветки и записью в неё
  // мог прийти чужой пуш, и без сверки мы бы молча его перезаписали.
  // Не совпало → failed_precondition('stale').
  rpc CommitToBranch(CommitToBranchRequest) returns (CommitToBranchResponse);
  // Ф4 «правка списка как кода», ЧТЕНИЕ: канонический текст list.json по
  // содержимому версии — ровно тот, что уехал бы в коммит. Собирает ядро тем же
  // кодом, что и запись: показать человеку одно, а закоммитить другое нельзя.
  rpc RenderCanon(RenderCanonRequest) returns (RenderCanonResponse);
  // Ф4, ЗАПИСЬ: строгий разбор отредактированного текста. Проекция push читает
  // канон мягко (чужой клон мог отстать от формата, брак там просто выпадает) —
  // для редактора это недопустимо: человек правит текст и обязан узнать, что
  // именно в нём не так. Ошибки приходят ВСЕ разом и кодами, а не текстом:
  // язык читателя знает интерфейс, а не ядро.
  rpc ParseCanon(ParseCanonRequest) returns (ParseCanonResponse);
}

message RenderCanonRequest {
  RepoRef repo = 1;       // нужен, чтобы взять kind и надстройки блоков из БД
  ListContent content = 2;
}

message RenderCanonResponse {
  string canon = 1; // текст list.json (UTF-8, ровно как в дереве)
}

message ParseCanonRequest {
  RepoRef repo = 1;
  string canon = 2; // отредактированный текст
}

// Придирка к тексту. `path` — JSON Pointer (RFC 6901) к узлу: позицию в буфере
// по нему находит редактор. Ядру принадлежит ФОРМАТ, а не то, как текст разложен
// по строкам в чужом окне; line/column поэтому заполнены только у syntax, где
// указателя на поле не существует.
message CanonIssue {
  string path = 1;
  string code = 2;    // 'syntax' | 'schema' | 'step_title_required'
  string message = 3; // техническое пояснение для журнала
  uint32 line = 4;    // 1-based, только у syntax
  uint32 column = 5;  // 1-based, только у syntax
}

message ParseCanonResponse {
  // Пусто → текст годен, content можно нести в AddVersion.
  repeated CanonIssue issues = 1;
  ListContent content = 2;
}

// Содержимое версии списка СТРУКТУРОЙ — канонические байты list.json собирает
// ядро (единственный владелец формата). Клиент формат не сериализует: иначе
// правила формата живут в двух реализациях и расходятся.
message ListContent {
  string title = 1;
  string desc = 2;
  repeated string tags = 3;
  bool ordered = 4;
  int32 version = 5;
  repeated SnapshotStep steps = 6;
}

message CommitToBranchRequest {
  RepoRef repo = 1;
  string branch = 2;      // ветка предложения; 'main' запрещён
  // 3 — бывшее `bytes list_json`: клиент присылал СОБРАННЫЙ канон, из-за чего
  // правила формата жили в двух реализациях. Номер не переиспользовать.
  reserved 3;
  reserved "list_json";
  string message = 4;     // заголовок коммита ('' → значение по умолчанию)
  string expected_tip = 5; // sha, на который рассчитывает вызывающий ('' — не сверять)
  string author_name = 6;  // автор коммита ('' → SetFork)
  string author_email = 7; // '' → служебный адрес SetFork
  ListContent content = 8; // канон собирает ЯДРО из этой структуры
}

message CommitToBranchResponse {
  string tip_sha = 1;  // новый tip ВЕТКИ
  bool changed = 2;    // false — list.json совпал с текущим, коммита нет
}

message UpdateBranchRequest {
  RepoRef repo = 1;
  string name = 2; // ветка, в которую вливаем main
}

message UpdateBranchResponse {
  string tip_sha = 1;    // новый tip ВЕТКИ
  bool fast_forward = 2; // ветка просто передвинута на main
}

message ListCommitsRequest {
  RepoRef repo = 1;
  string rev = 2;     // ветка, тег или sha
  string not_in = 3;  // скрыть достижимое отсюда ('' — не скрывать)
  int32 limit = 4;    // 0 → 100; больше 500 обрезается
}

message Commit {
  string sha = 1;
  string message = 2; // полное сообщение (первая строка — заголовок)
  string author_name = 3;
  string author_email = 4;
  int64 at_unix = 5;  // время автора, секунды
  int32 parents = 6;  // 2+ — merge-коммит
}

message CommitsResponse {
  bool found = 1;               // rev существует
  repeated Commit commits = 2;  // свежие первыми
}

message CreateTagRequest {
  RepoRef repo = 1;
  string name = 2;    // имя тега релиза (человекочитаемое)
  int32 version = 3;  // версия, на чей коммит вешаем (коммит = тег vN)
}

message Tag {
  string name = 1;
  string target_sha = 2;
}

message TagsResponse {
  repeated Tag tags = 1; // по имени
}

message MergeStateRequest {
  RepoRef repo = 1;
  string branch = 2;
}

message MergeStateResponse {
  bool found = 1; // ветка и merge-base существуют
  string merge_base_sha = 2;
  BranchSnapshotResponse base = 3;
  BranchSnapshotResponse ours = 4;   // main
  BranchSnapshotResponse theirs = 5; // ветка
}

message MergeResolvedRequest {
  RepoRef repo = 1;
  string branch = 2;
  // 3 — бывшее `bytes list_json` (см. CommitToBranchRequest). Не переиспользовать.
  reserved 3;
  reserved "list_json";
  ListContent content = 4; // разрешённый канон структурой; собирает ЯДРО
  // Способ слияния — семантика ровно как в MergeBranchRequest. Без этих полей
  // список, настроенный на squash, получал бы историю ветки только потому, что
  // при слиянии случился конфликт; фронт из-за этого просто ОТКАЗЫВАЛ в ручном
  // резолве на squash-списках, маскируя отказ под 'conflict'.
  string mode = 5;    // '' и 'merge' — merge-коммит; 'squash' — один родитель
  string message = 6; // заголовок squash-коммита ('' → 'Squashed branch <name>')
}

message MergeBranchRequest {
  RepoRef repo = 1;
  string name = 2; // ветка, вливаемая в main
  // Способ слияния. '' и 'merge' — как было (ff, иначе merge-коммит).
  // 'squash' — ОДИН коммит с одним родителем: история ветки в main не уезжает,
  // а вклад авторов сохраняется трейлерами Co-authored-by в сообщении.
  string mode = 3;
  // Сообщение squash-коммита ('' → 'Squashed branch <name>'). Для 'merge' не
  // используется: у merge-коммита сообщение каноническое.
  string message = 4;
}

message MergeBranchResponse {
  string tip_sha = 1;    // новый tip main
  int32 new_version = 2; // спроецированная версия (0 = не создана)
  bool fast_forward = 3;
}

message CreateBranchRequest {
  RepoRef repo = 1;
  string name = 2; // новая ветка (без refs/heads/)
  string from = 3; // база ('' = main)
}

message DeleteBranchRequest {
  RepoRef repo = 1;
  string name = 2;
}

message BranchOpResponse {
  string tip_sha = 1; // create: tip новой ветки; delete: ''
}

message Branch {
  string name = 1;      // без префикса refs/heads/
  string tip_sha = 2;
  bool is_default = 3;  // main
  int32 ahead = 4;      // коммитов впереди main
  int32 behind = 5;     // коммитов позади main
}

message BranchesResponse {
  repeated Branch branches = 1; // main первым, остальные по имени
}

message BranchSnapshotRequest {
  RepoRef repo = 1;
  string branch = 2; // имя ветки (без refs/heads/)
}

message SnapshotStep {
  int32 n = 1;
  string title = 2;
  string desc = 3;
  string command = 4;
  string level = 5;
  string why = 6;
  string section = 7;
  repeated string subtasks = 8;
  repeated SnapshotRef refs = 9;
  // Блочная модель: '' | 'step' = шаг; 'text'|'image' — презентационный блок.
  string type = 10;
  string content_json = 11; // JSON payload не-step блока ('' = нет)
  // Стабильная идентичность блока (ADR-0013): с ней переименование пункта в
  // диффе ветки читается как «изменён», а не «удалён + добавлен». '' = нет
  // (данные старше идентичности).
  string block_id = 12;
  // РАЗРУШИТЕЛЬНЫЙ ПУНКТ: команда необратима (сносит данные, тома, окружение).
  // Не запрет — запрет живёт отдельно и не пускает такое в публикацию вовсе;
  // это пометка на законной, но опасной команде, из-за которой пункт не
  // попадает в собранный скрипт исполняемым.
  bool danger = 13;
  // Ф4-довесок: поля, которые канон НЕСЁТ, а провод раньше терял. Для ParseCanon
  // это критично — вернуть содержимое без них значит, что сохранение из редактора
  // кода сотрёт картинку и пометку (набор шагов перезаписывается ЦЕЛИКОМ; ровно
  // этот баг уже чинили дважды — с needs_human и danger).
  //
  // Отсутствие поля в ТЕКСТЕ здесь = явное «нет», а не «не задано»: редактор
  // показывает полный снимок, и что человек видит, то и сохранится. Тристейт с
  // переносом значения из прошлой версии остаётся у проекции push, где чужой
  // клон мог просто не знать о поле.
  string image_key = 14;         // S3-ключ картинки шага ('' = нет)
  bool needs_human = 15;         // «здесь нужен человек»
  string needs_human_ask = 16;   // вопрос к пометке ('' = общий текст)
}

message SnapshotRef {
  string label = 1;
  string url = 2; // '' = нет
}

message BranchSnapshotResponse {
  bool found = 1;
  string tip_sha = 2;
  string title = 3;
  string desc = 4;
  repeated string tags = 5;
  bool ordered = 6;
  repeated SnapshotStep steps = 7;
}

// Ф3: исход пуша зеркала.
message MirrorPushResponse {
  bool ok = 1;
  string error = 2; // '' при ok; текст без кредов
}

// Ф2: исход проверки доступа. Форма та же, что у пуша, но сообщение своё:
// проверка и пуш — разные операции, и их ответы будут расходиться (проверке
// однажды понадобится сказать, например, пуст ли репозиторий на фордже).
message MirrorCheckResponse {
  bool ok = 1;
  string error = 2; // '' при ok; текст без кредов
}

// Ф5: что умеет ЭТО ядро.
//
// Нужно потому, что правило «посторонний пишет только в своё пространство»
// исполняет ядро, а пускает постороннего фронт — и выкатываются они порознь.
// Фронт с Ф5 рядом со старым ядром пустил бы постороннего к ядру, которое роли
// не смотрит вовсе, и тот дописал бы прямо в main (авто-ревью core#80).
//
// Порядок выкатки такую пару чинит только на бумаге: инструкцию можно
// перепутать, а ядро — откатить назад, оставив фронт новым. Поэтому фронт
// СПРАШИВАЕТ, а не полагается на порядок.
//
// Форма — та же, что у самого git: сервер объявляет возможности (`report-status`,
// `side-band-64k`, `delete-refs`), клиент пользуется только объявленным. Молчание
// значит «не умею»: старое ядро на неизвестный метод ответит UNIMPLEMENTED, и
// фронт обязан прочитать это как отказ, а не как ошибку связи.
message CapabilitiesRequest {}

message CapabilitiesResponse {
  // Ядро смотрит на роль пушащего и держит постороннего в его пространстве (Ф5).
  bool enforces_push_roles = 1;
}
