# Отдельный ДЕМО-деплой SetFork (demo.sethub.ru) — полностью изолирован от прода:
# СВОЙ Postgres (demo-база), свой git-том, свой домен. Реальный sethub.ru не видит
# этот контент вообще. Тот же образ приложения, что и прод.
#
# git обслуживает Rust-ядро (setfork-demo-core) — второй реализации больше нет.
# Образом из GHCR, а не сборкой: соседнего чекаута ../setfork-core тут не бывает.
# Том git-объектов принадлежит ЯДРУ; приложение его не монтирует вовсе.
#
# ВАЖНО (урок с проды): все имена сервисов УНИКАЛЬНЫЕ (setfork-demo-*), чтобы алиасы
# в общей сети `edge` не пересекались с другими проектами.
#
# Наполнение после первого деплоя:
#   docker compose -f docker-compose.demo.yml run --rm --no-deps migrate npx tsx scripts/seed-demo.ts
services:
  setfork-demo-db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sethub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sethub_demo}
    volumes:
      - demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sethub} -d ${POSTGRES_DB:-sethub_demo}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [edge]

  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sethub}:${POSTGRES_PASSWORD}@setfork-demo-db:5432/${POSTGRES_DB:-sethub_demo}
    depends_on:
      setfork-demo-db: { condition: service_healthy }
    restart: 'no'
    networks: [edge]

  # Авто-наполнение demo-данными при деплое (one-shot, после миграций). Скрипт
  # идемпотентный: пересоздаёт свой набор demo-юзеров/списков — можно гонять каждый
  # деплой (демо всегда в чистом известном состоянии). Отключить: DEMO_SEED=0.
  seed:
    build: { context: ., target: migrate } # тот же образ: есть tsx + исходники + drizzle
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sethub}:${POSTGRES_PASSWORD}@setfork-demo-db:5432/${POSTGRES_DB:-sethub_demo}
      DEMO_SEED: ${DEMO_SEED:-1}
    entrypoint: ['sh', '-c', 'if [ "$$DEMO_SEED" = "1" ]; then npx tsx scripts/seed-demo.ts; else echo "DEMO_SEED=0 — сид пропущен"; fi']
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: 'no'
    networks: [edge]

  # imgproxy для demo-картинок. Читает оригиналы из того же S3 (Selectel), но по
  # префиксу demo/ — чтобы demo-медиа не смешивалось с прод. Порт 8082 (прод — 8081).
  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v3.31.0
    restart: always
    environment:
      IMGPROXY_USE_S3: 'true'
      IMGPROXY_S3_ENDPOINT: ${S3_ENDPOINT}
      IMGPROXY_S3_REGION: ${S3_REGION}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      IMGPROXY_ALLOWED_SOURCES: s3://${S3_BUCKET}/
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      IMGPROXY_AUTO_WEBP: 'true'
      IMGPROXY_MAX_SRC_RESOLUTION: '50'
      # CORS для ре-кропа аватара через canvas (см. основной compose).
      IMGPROXY_ALLOW_ORIGIN: ${IMGPROXY_ALLOW_ORIGIN:-*}
    ports:
      - '${DEMO_IMGPROXY_PORT:-8082}:8080'
    networks: [edge]

  app:
    build:
      context: .
      target: runner
      # NEXT_PUBLIC_* вшиваются в бандл на СБОРКЕ, а не читаются из окружения
      # готового контейнера: подавать их ниже в `environment:` бесполезно.
      # Без этих аргументов демо-стенд собирался с дефолтом канона, и его
      # метаданные, robots.txt и ссылки вели на setfork.com — поисковик получал
      # канонические ссылки чужого сайта, а пользователь демо уезжал на прод.
      # На проде это не замечалось: там дефолт и есть правильное значение.
      # R13 линзы 08.
      args:
        NEXT_PUBLIC_SITE_URL: ${DEMO_SITE_URL:-https://demo.sethub.ru}
        NEXT_PUBLIC_DOCS_URL: ${DEMO_DOCS_URL:-}
        NEXT_PUBLIC_ABOUT_URL: ${DEMO_ABOUT_URL:-}
    container_name: setfork-demo
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sethub}:${POSTGRES_PASSWORD}@setfork-demo-db:5432/${POSTGRES_DB:-sethub_demo}
      # git — только через ядро; GIT_DATA_DIR приложению больше не нужен
      SETFORK_CORE_URL: '1'
      SETFORK_CORE_ADDR: setfork-demo-core:50051
      SETFORK_CORE_TOKEN: ${SETFORK_CORE_TOKEN:-}
      NEXT_PUBLIC_SITE_URL: ${DEMO_SITE_URL:-https://demo.sethub.ru}
      APP_URL: ${DEMO_SITE_URL:-https://demo.sethub.ru}
    depends_on:
      setfork-demo-db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      setfork-demo-core: { condition: service_healthy }
    networks: [edge]

  # git-ядро демо-стенда. Своя копия — демо не должно ходить в прод-репозитории.
  setfork-demo-core:
    image: ghcr.io/mikey-semy/setfork-core:latest
    container_name: setfork-demo-core
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sethub}:${POSTGRES_PASSWORD}@setfork-demo-db:5432/${POSTGRES_DB:-sethub_demo}
      GIT_DATA_DIR: /data/git
      SETFORK_CORE_ADDR: 0.0.0.0:50051
      SETFORK_CORE_TOKEN: ${SETFORK_CORE_TOKEN:-}
      # Токена может не быть — демо во внутренней сети, наружу порт не публикуется.
      #
      # Раньше тут стояла склейка ${SETFORK_CORE_TOKEN:+0}${SETFORK_CORE_TOKEN:-1} в расчёте
      # на «0, если токен задан, иначе 1». Вторая половина работает не так: `:-` подставляет
      # ЗНАЧЕНИЕ переменной, когда она задана, — то есть при заданном токене переменная
      # принимала вид «0<сам токен>». Секрет копировался во вторую переменную окружения и
      # был виден всем, кто читает окружение контейнера (docker inspect, `env` в шелле,
      # дампы процесса). Флаг при этом держался случайно: ядро считает истиной только «1»
      # и «true», а «0<токен>» под них не подходит (P1 из авто-ревью).
      #
      # Тернарника в compose нет, поэтому связку задаём явной переменной: без токена — 1
      # (демо в закрытой сети), стенд с токеном ставит 0 в своём .env.
      SETFORK_ALLOW_INSECURE: ${SETFORK_ALLOW_INSECURE:-1}
    volumes:
      - demo_gitdata:/data/git
    depends_on:
      setfork-demo-db: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'grpc_health_probe', '-addr=127.0.0.1:50051']
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [edge]

volumes:
  demo_pgdata:
  demo_gitdata:

networks:
  # Та же внешняя сеть, что у канона: стенд ходит туда же, куда прод.
  edge:
    external: true
