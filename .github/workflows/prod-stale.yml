name: Прод отстаёт?

# Тревога отвечает на вопрос «ПРОД ОТСТАЁТ?», а не «упал ли последний прогон» —
# и потому живёт по расписанию, а не внутри CI.
#
# Почему пришлось разделить. Тревога внутри CI срабатывала на КАЖДОМ красном
# прогоне: 10–11.08 четыре срабатывания за двое суток, три закрылись сами (R6
# линзы 08). Первая попытка починки — порог «тревожим, если отстаём дольше
# шести часов» прямо в джобе `stuck` — заменила шум МОЛЧАНИЕМ: если первый
# красный прогон случился через два часа после выкатки и новых пушей нет,
# условие больше никогда не пересчитается, и простой останется незамеченным.
# Замечание авто-ревью на fe#787 (P1).
#
# Отсюда форма: состояние проверяется по часам, событие (красный прогон) лишь
# пишет строку в сводку своего прогона. Состояние и событие — разные вопросы,
# и смешивать их в одном триггере нельзя.
on:
  schedule:
    # Раз в час: при пороге в шесть часов этого хватает, чтобы заметить простой
    # с точностью до часа, и не хватает, чтобы создать шум.
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: prod-stale
  cancel-in-progress: true

jobs:
  check:
    runs-on: [self-hosted, setfork]
    permissions:
      contents: read
      issues: write
      deployments: read
      # Второе мнение о выкатке читается из прогонов CI, а явный блок permissions
      # выключает всё неперечисленное — без этой строки вызовы вернули бы 403.
      actions: read
    steps:
      - name: Сравнить прод с master и решить, тревожить ли
        uses: actions/github-script@v7
        env:
          STALE_ALERT_HOURS: ${{ vars.STALE_ALERT_HOURS || '6' }}
        with:
          script: |
            const TITLE = '🟠 Прод отстаёт от master'
            // Тревогу узнаём по МЕТКЕ, а не по заголовку: закрывает её ещё и джоба
            // деплоя в ci.yml, и пока идентичностью служил текст, он жил в двух
            // файлах и молча разъехался при переименовании — закрыватель перестал
            // находить тревогу. Метка переживает любую правку названия.
            // Замечание авто-ревью на fe#787 (P2).
            const LABEL = 'alert:prod-stale'
            const STALE_HOURS = Number(process.env.STALE_ALERT_HOURS || 6)

            const { data: ref } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/master' })
            const tip = ref.object.sha

            // ── Источник первый: витрина Deployments ──────────────────────────
            // Её заполняет сама джоба деплоя. Глубина поиска здесь НЕ порог, а бюджет
            // запросов: витрина хранит и неудачные попытки, поэтому в затяжной аварии
            // успешная уезжает вниз. Промахнуться глубиной нельзя — исчерпание поиска
            // само поднимает тревогу, а не оставляет тишину.
            // Замечание авто-ревью на core#97 (P1).
            const выкатки = async () => {
              const { data: deps } = await github.rest.repos.listDeployments({
                ...context.repo, environment: 'production', per_page: 100,
              })
              for (const d of deps) {
                const { data: st } = await github.rest.repos.listDeploymentStatuses({
                  ...context.repo, deployment_id: d.id, per_page: 1,
                })
                if (st[0]?.state === 'success') return { deps, live: d }
              }
              return { deps, live: null }
            }

            // ── Источник второй: сами прогоны CI ──────────────────────────────
            // Витрину заполняют шаги с `continue-on-error` (сбой её API не должен
            // ронять доставку), поэтому выкатка может пройти, а записи не появиться.
            // Тогда витрина навсегда показывает предыдущую ревизию, и тревога горела
            // бы ложно КАЖДЫЙ тихий период — ровно тот шум, ради которого всё это
            // писалось. Факт доставки — джоба `deploy`, завершившаяся успехом; витрина
            // лишь её отражение. Заодно ловим выкатку В ПУТИ: пока прогон на вершине
            // master идёт, отставание объявлять рано.
            // Замечания авто-ревью на core#97 (оба P2).
            const поПрогонам = async () => {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: 'ci.yml', branch: 'master', per_page: 20,
              })
              for (const run of data.workflow_runs) {
                const { data: jl } = await github.rest.actions.listJobsForWorkflowRun({
                  ...context.repo, run_id: run.id, per_page: 50,
                })
                const d = jl.jobs.find((j) => j.name === 'deploy')
                if (!d) continue
                if (run.head_sha === tip && d.status !== 'completed') return { идёт: true, sha: null }
                if (d.conclusion === 'success') return { идёт: false, sha: run.head_sha }
              }
              return { идёт: false, sha: null }
            }

            /**
             * ЧТО НА ПРОДЕ — сведение обоих источников, и ЕДИНСТВЕННЫЙ ответ на этот
             * вопрос: всё остальное считается от него.
             *
             * Раньше второе мнение спрашивалось заплаткой перед самой тревогой, и это
             * оставляло две дыры (замечания авто-ревью на fe#787, оба P2):
             *   • пустая витрина уводила в ранний выход ДО второго мнения — то есть
             *     при полном отказе записи мы молчали, хотя ради этого случая второй
             *     источник и заводился;
             *   • если прогоны знали свежую ревизию B, а витрина — старую A, отставание
             *     всё равно считалось от A: цифры в тревоге завышались.
             *
             * Порядок опроса дешёвый: витрина отвечает одним-двумя запросами, и в норме
             * (прод на вершине) на этом всё заканчивается. К прогонам идём, только когда
             * витрина свежесть не подтвердила, — там до двух десятков запросов.
             *
             * Прогоны приоритетнее витрины: доставку делает джоба, а витрина лишь
             * записывает о ней — и записывает не всегда.
             */
            const наПроде = async () => {
              const { deps, live } = await выкатки()
              if (live?.sha === tip) return { sha: tip, идёт: false, deps, источник: 'витрина' }
              const факт = await поПрогонам()
              if (факт.идёт) return { sha: null, идёт: true, deps, источник: 'прогоны' }
              if (факт.sha) return { sha: факт.sha, идёт: false, deps, источник: 'прогоны' }
              return { sha: live?.sha ?? null, идёт: false, deps, источник: 'витрина' }
            }

            const открытые = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', labels: LABEL, per_page: 100,
            })
            const тревога = открытые.find((i) => !i.pull_request)

            const снять = async (почему) => {
              if (!тревога) return core.notice(почему)
              await github.rest.issues.createComment({ ...context.repo, issue_number: тревога.number, body: почему })
              await github.rest.issues.update({ ...context.repo, issue_number: тревога.number, state: 'closed' })
              core.notice(`${почему} — тревога #${тревога.number} закрыта`)
            }

            /**
             * Поднять тревогу. Открытую ОБНОВЛЯЕМ, а не комментируем: иначе суточный
             * простой дал бы 24 комментария и 24 уведомления подписчикам — ровно та
             * усталость от тревог, ради устранения которой всё и затевалось. Правка тела
             * писем не шлёт, а цифры в нём всегда свежие; это же и обычная форма у ботов
             * GitHub («sticky comment»). Замечание авто-ревью на fe#787 (P2).
             *
             * Перед тем как шуметь — свежий взгляд, и ДО ветки обновления: иначе открытая
             * тревога переписывалась бы цифрами от устаревшего снимка. Ничто не
             * упорядочивает этот воркфлоу и выкатку между собой, поэтому состояние могло
             * измениться, пока мы считали.
             */
            const поднять = async (body, чем) => {
              const сейчас = await наПроде()
              if (сейчас.идёт) {
                return core.notice(`выкатка на \`${tip.slice(0, 7)}\` идёт прямо сейчас — тревогу не заводим`)
              }
              if (сейчас.sha === tip) {
                return снять(`пока считали, прод догнал master (\`${tip.slice(0, 7)}\`, источник: ${сейчас.источник})`)
              }
              if (тревога) {
                await github.rest.issues.update({ ...context.repo, issue_number: тревога.number, body })
                return core.notice(`обновил тревогу #${тревога.number} (${чем})`)
              }
              // Метку заводим явно и идемпотентно. Документация REST обещает лишь, что
              // метки «тихо отбрасываются» без прав, и НЕ обещает создавать отсутствующие.
              // Отброшенная метка означала бы, что следующая проверка не найдёт эту тревогу
              // и заведёт вторую, потом третью — отказ ровно в сторону шума. 422 = уже есть.
              try {
                await github.rest.issues.createLabel({
                  ...context.repo, name: LABEL, color: 'D93F0B',
                  description: 'Автотревога: прод отстаёт от master',
                })
              } catch (e) {
                if (e.status !== 422) throw e
              }
              const { data: made } = await github.rest.issues.create({
                ...context.repo, title: TITLE, body, labels: [LABEL],
              })
              core.notice(`завёл тревогу #${made.number} (${чем})`)
            }

            const хвост = [
              '',
              'Тревога закроется сама, как только прод догонит master. Пока простой длится,',
              `цифры выше переписываются почасовой проверкой — [последняя](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
            ].join('\n')

            const прод = await наПроде()
            if (прод.идёт) return core.notice(`выкатка на \`${tip.slice(0, 7)}\` идёт прямо сейчас`)
            if (прод.sha === tip) return снять(`прод на вершине master (\`${tip.slice(0, 7)}\`, источник: ${прод.источник})`)

            if (!прод.sha) {
              // НИ ОДИН из двух источников не знает успешной выкатки. Раньше здесь стояло
              // предупреждение в лог — то есть ТИШИНА ровно в самой тяжёлой аварии.
              // Точный коммит прода неизвестен, но для ответа на вопрос «прод отстаёт?»
              // он и не нужен. Замечание авто-ревью на core#97 (P1).
              const старейшая = прод.deps[прод.deps.length - 1]
              const срок = старейшая ? `${((Date.now() - Date.parse(старейшая.created_at)) / 3.6e6).toFixed(1)} ч` : 'неизвестно сколько'
              const сколько = прод.deps.length ? `среди последних ${прод.deps.length} попыток` : 'и записей о попытках нет вовсе'
              return поднять([
                `**Успешных выкаток не найдено** ${сколько} — за ${срок}.`,
                '',
                'Ни витрина Deployments, ни джобы `deploy` в прогонах CI не подтверждают ни одной',
                'успешной доставки. Значит либо выкатка падает раз за разом, либо перестали',
                'заполняться оба источника. Коммит на проде определить нечем, поэтому сравнения',
                'с master ниже нет.',
                '',
                'Что делать: посмотреть последние прогоны CI на master и джобу `deploy` в них.',
                хвост,
              ].join('\n'), `успешных выкаток нет (${срок})`)
            }

            // ВОЗРАСТ ОТСТАВАНИЯ считаем от ПЕРВОГО невыкаченного коммита, а не от
            // времени последней выкатки. Иначе после тихих выходных первый же пуш в
            // понедельник объявляется «отстаём трое суток»: прод всё это время был
            // свеж, отставание началось ровно с этого коммита. Замечание авто-ревью
            // на fe#787 (P2).
            const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo, basehead: `${прод.sha}...${tip}`,
            })
            const первый = cmp.commits[0]
            if (!первый) return снять('master не ушёл вперёд прода')

            const начало = Date.parse(первый.commit.committer?.date ?? первый.commit.author.date)
            const ageH = (Date.now() - начало) / 3.6e6
            const behind = cmp.ahead_by

            if (ageH < STALE_HOURS) {
              return core.notice(
                `прод отстаёт ${ageH.toFixed(1)} ч (${behind} коммитов), порог ${STALE_HOURS} ч — пока не тревожим`,
              )
            }

            const body = [
              `**Прод отстаёт от master ${ageH.toFixed(1)} ч**, не уехало коммитов: **${behind}**.`,
              '',
              `На проде: \`${прод.sha.slice(0, 7)}\` (источник: ${прод.источник}) · вершина master: \`${tip.slice(0, 7)}\``,
              `Первый невыкаченный коммит: \`${первый.sha.slice(0, 7)}\` — ${первый.commit.message.split('\n')[0]}`,
              '',
              `Порог ${STALE_HOURS} ч выбран по распределению: 91 выкатка за две недели дала медиану интервала 1,4 ч, p90 = 7,1 ч.`,
              '',
              'Что делать: посмотреть последний прогон CI на master. Если упал флейк — `gh run rerun <id> --failed`,',
              'зелёный прогон утянет выкатку. Выкатить текущий master без нового коммита: `gh workflow run ci.yml --ref master`.',
              хвост,
            ].join('\n')

            await поднять(body, `${ageH.toFixed(1)} ч, ${behind} коммитов`)
