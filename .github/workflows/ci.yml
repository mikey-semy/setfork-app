name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Ручная выкатка текущего master без нового коммита. Раньше это был
  # `gh workflow run deploy.yml`; воркфлоу деплоя больше нет, поэтому триггер
  # переехал сюда — возможность сохранена, адрес другой:
  # `gh workflow run ci.yml --ref master`.
  workflow_dispatch:


# На master прогон НЕ отменяем: деплой ждёт зелёный CI ИМЕННО этого коммита, а
# отменённый прогон не даёт ответа «можно ли катить». Ровно поэтому прежний гейт и
# сняли — при частых мержах master-CI не доживал до конца, и деплой вечно skipped.
# На PR отмена остаётся: там новый пуш обесценивает предыдущий прогон.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  check:
    runs-on: [self-hosted, setfork]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # cache: npm НЕ используем: на self-hosted раннере это скачивание архива
          # кэша из GitHub (из РФ — минуты на джобу). Вместо него ~/.npm смонтирован
          # персистентным томом раннера (setfork-ci-runner/docker-compose.yml), а
          # установка идёт --prefer-offline.
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      # Клиент proto собран из ЭТОГО proto? Расхождение молчаливое: правку .proto
      # видно в ревью, а забытый кодоген — нет, и на проводе оказывается контракт
      # прошлой версии. Ровно так уехал block_id (реестр 28.07, п.7).
      - name: proto ↔ кодоген не разъехались
        run: |
          npm run gen:proto
          # --ignore-all-space: генератор и форматтер расходятся на пробелах в
          # комментариях, и на этом гейт падал бы вхолостую. Ловим РАЗЪЕЗД КОНТРАКТА
          # (поля, типы, номера), а не расстановку пробелов.
          git diff --exit-code --ignore-all-space src/shared/gen || {
            echo "::error::src/shared/gen устарел — прогони npm run gen:proto и закоммить"
            exit 1
          }
      - run: npm test
      # Сборка тянет 5 шрифтов с fonts.googleapis.com (next/font/google в layout.tsx),
      # то есть КАЖДАЯ сборка зависит от внешнего хоста. С российских адресов это
      # лотерея: 30.07 master покраснел на «Failed to fetch `Manrope` from Google
      # Fonts» — при полностью зелёных тестах. Теперь деплой ждёт зелёный master-CI,
      # значит такой срыв ещё и останавливает выкладку.
      #
      # Повтор лечит именно СЕТЕВОЙ срыв: настоящая поломка сборки падает все три
      # раза одинаково. Понадобился повтор — пишем notice, чтобы флейк не стал
      # невидимым (настоящее лечение — держать шрифты у себя, next/font/local).
      - name: Сборка (до 3 попыток — внешние шрифты)
        run: |
          for i in 1 2 3; do
            npm run build && exit 0
            [ $i -lt 3 ] && { echo "::notice::сборка сорвалась (попытка $i/3) — вероятно загрузка шрифтов; повторяю"; sleep 15; }
          done
          echo "::error::сборка не прошла за 3 попытки"
          exit 1
        env:
          # Плейсхолдеры: build динамических роутов к БД не ходит; нужны лишь для чтения env.
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-placeholder-secret-at-least-32-characters

  # Интеграция data-layer против реального Postgres (pgvector). Схема — drizzle-kit push
  # (не migrate: журнал миграций хрупкий, для эфемерной БД push надёжнее).
  # ВАЖНО про Postgres/Redis: `services:` здесь НЕ работают. Раннер сам живёт в
  # контейнере (sibling-демон через docker.sock), поэтому порты сервисов
  # публикуются на ХОСТЕ, а `localhost` внутри раннера — это он сам: подключение
  # к localhost:<порт> не доходит никогда (job падал на connect всегда, а при
  # фиксированном '5432:5432' ещё и ловил «port is already allocated»).
  # Рабочий приём — тот же, что в setfork-core: поднимаем sibling-контейнеры в
  # своей сети и ПОДКЛЮЧАЕМ К НЕЙ САМ РАННЕР, обращаясь по имени контейнера.
  integration:
    runs-on: [self-hosted, setfork]
    steps:
      - name: Postgres + Redis (sibling-контейнеры в сети раннера)
        run: |
          NET="ci-${GITHUB_RUN_ID}-integration"
          docker network create "$NET" >/dev/null 2>&1 || true
          docker rm -f "pg-$NET" "redis-$NET" >/dev/null 2>&1 || true
          docker run -d --name "pg-$NET" --network "$NET" \
            -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci \
            pgvector/pgvector:pg16 >/dev/null
          docker run -d --name "redis-$NET" --network "$NET" redis:7-alpine >/dev/null
          docker network connect "$NET" "$(hostname)" >/dev/null 2>&1 || true
          for i in $(seq 1 60); do
            docker exec "pg-$NET" pg_isready -U ci -d ci >/dev/null 2>&1 && break
            sleep 1
          done
          echo "CI_NET=$NET" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://ci:ci@pg-$NET:5432/ci" >> "$GITHUB_ENV"
          echo "CI_REDIS_URL=redis://redis-$NET:6379" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # cache: npm НЕ используем: на self-hosted раннере это скачивание архива
          # кэша из GitHub (из РФ — минуты на джобу). Вместо него ~/.npm смонтирован
          # персистентным томом раннера (setfork-ci-runner/docker-compose.yml), а
          # установка идёт --prefer-offline.
      - run: npm ci --prefer-offline --no-audit --no-fund
      # Бутстрап вне схемы: расширения до push, канон поиска (0028) после —
      # тот же путь, что db:init у людей (линза 07: push сам этого не делает).
      - run: npx tsx scripts/db-bootstrap.ts pre
      - run: npx drizzle-kit push --force
      - run: npx tsx scripts/db-bootstrap.ts post
      # Ядро — sibling-контейнер ПОСЛЕ применения схемы (на старте оно ходит в БД).
      # С Ф1 (git-first) запись версий идёт ТОЛЬКО через ядро — без него все
      # итесты путей записи падают ECONNREFUSED. Пакет GHCR приватный, но образ
      # всегда лежит в кэше этого же docker-демона: job image ядра собирает его
      # здесь на каждый push в master (pull — попытка освежить, не условие).
      # Если образа вдруг нет — прогнать master-CI ядра или дать фронту read к пакету.
      - name: setfork-core (sibling из GHCR — git-first запись версий, Ф1)
        run: |
          IMAGE=ghcr.io/mikey-semy/setfork-core:latest
          docker pull "$IMAGE" >/dev/null 2>&1 || true
          docker rm -f "core-$CI_NET" >/dev/null 2>&1 || true
          docker run -d --name "core-$CI_NET" --network "$CI_NET" \
            -e DATABASE_URL="postgresql://ci:ci@pg-$CI_NET:5432/ci" \
            -e SETFORK_ALLOW_INSECURE=1 \
            "$IMAGE" >/dev/null
          for i in $(seq 1 60); do
            # Готовность — из healthcheck образа, а НЕ из строки в логе: строка
            # зависит от языка сборки, и ядро давно пишет «listening». Проверка на
            # «слушает» с тех пор не срабатывала ни разу — цикл просто спал все 60
            # секунд и шёл дальше (замечено 10.08 при подъёме того же образа локально).
            [ "$(docker inspect -f '{{.State.Health.Status}}' "core-$CI_NET" 2>/dev/null)" = healthy ] && { echo "core up"; break; }
            sleep 1
          done
          docker logs "core-$CI_NET" 2>&1 | tail -3
          echo "SETFORK_CORE_URL=1" >> "$GITHUB_ENV"
          echo "SETFORK_CORE_ADDR=core-$CI_NET:50051" >> "$GITHUB_ENV"
      - run: npm run test:integration
      - name: core log (on failure)
        if: failure()
        run: docker logs "core-${CI_NET}" 2>&1 | tail -100 || true
      # Redis-бэкенд rate-limit против настоящего Redis (Lua fixedWindow/tokenBucket).
      - run: npx vitest run tests/shared/rate-limit-store.redis.test.ts
        env:
          REDIS_URL: ${{ env.CI_REDIS_URL }}
      - name: cleanup (контейнеры и сеть)
        if: always()
        run: |
          docker rm -f "pg-${CI_NET}" "redis-${CI_NET}" "core-${CI_NET}" >/dev/null 2>&1 || true
          docker network disconnect "${CI_NET}" "$(hostname)" >/dev/null 2>&1 || true
          docker network rm "${CI_NET}" >/dev/null 2>&1 || true

  # Барьер покрытия: честная цифра = unit + integration (unit-репорт врёт 0% на data-layer).
  # Сливаем оба coverage-final.json и держим порог, чтобы покрытие не проседало.
  # Барьер покрытия — на push в master, а НЕ на каждый PR: юниты уже прогнаны в
  # check, интеграционные — в integration, и третий прогон под инструментацией
  # (~12 мин раннера) про сам PR ничего нового не говорит. Порог стережёт master.
  coverage:
    if: github.event_name == 'push'
    runs-on: [self-hosted, setfork]
    steps:
      # Sibling-контейнер в сети раннера — см. пояснение у job integration выше.
      - name: Postgres (sibling-контейнер в сети раннера)
        run: |
          NET="ci-${GITHUB_RUN_ID}-coverage"
          docker network create "$NET" >/dev/null 2>&1 || true
          docker rm -f "pg-$NET" >/dev/null 2>&1 || true
          docker run -d --name "pg-$NET" --network "$NET" \
            -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci \
            pgvector/pgvector:pg16 >/dev/null
          docker network connect "$NET" "$(hostname)" >/dev/null 2>&1 || true
          for i in $(seq 1 60); do
            docker exec "pg-$NET" pg_isready -U ci -d ci >/dev/null 2>&1 && break
            sleep 1
          done
          echo "CI_NET=$NET" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://ci:ci@pg-$NET:5432/ci" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # cache: npm НЕ используем: на self-hosted раннере это скачивание архива
          # кэша из GitHub (из РФ — минуты на джобу). Вместо него ~/.npm смонтирован
          # персистентным томом раннера (setfork-ci-runner/docker-compose.yml), а
          # установка идёт --prefer-offline.
      - run: npm ci --prefer-offline --no-audit --no-fund
      # Бутстрап вне схемы: расширения до push, канон поиска (0028) после —
      # тот же путь, что db:init у людей (линза 07: push сам этого не делает).
      - run: npx tsx scripts/db-bootstrap.ts pre
      - run: npx drizzle-kit push --force
      - run: npx tsx scripts/db-bootstrap.ts post
      # Ядро для интеграционной части покрытия — та же причина и приём, что в job integration.
      - name: setfork-core (sibling из GHCR — git-first запись версий, Ф1)
        run: |
          IMAGE=ghcr.io/mikey-semy/setfork-core:latest
          docker pull "$IMAGE" >/dev/null 2>&1 || true
          docker rm -f "core-$CI_NET" >/dev/null 2>&1 || true
          docker run -d --name "core-$CI_NET" --network "$CI_NET" \
            -e DATABASE_URL="postgresql://ci:ci@pg-$CI_NET:5432/ci" \
            -e SETFORK_ALLOW_INSECURE=1 \
            "$IMAGE" >/dev/null
          for i in $(seq 1 60); do
            # Готовность — из healthcheck образа, а НЕ из строки в логе: строка
            # зависит от языка сборки, и ядро давно пишет «listening». Проверка на
            # «слушает» с тех пор не срабатывала ни разу — цикл просто спал все 60
            # секунд и шёл дальше (замечено 10.08 при подъёме того же образа локально).
            [ "$(docker inspect -f '{{.State.Health.Status}}' "core-$CI_NET" 2>/dev/null)" = healthy ] && { echo "core up"; break; }
            sleep 1
          done
          echo "SETFORK_CORE_URL=1" >> "$GITHUB_ENV"
          echo "SETFORK_CORE_ADDR=core-$CI_NET:50051" >> "$GITHUB_ENV"
      - run: npm run coverage:unit
      - run: npm run coverage:integration
      - run: npm run coverage:check # порог --min из package.json
      - name: cleanup (контейнер и сеть)
        if: always()
        run: |
          docker rm -f "pg-${CI_NET}" "core-${CI_NET}" >/dev/null 2>&1 || true
          docker network disconnect "${CI_NET}" "$(hostname)" >/dev/null 2>&1 || true
          docker network rm "${CI_NET}" >/dev/null 2>&1 || true

  # ── Выкатка на прод ─────────────────────────────────────────────────────────
  #
  # ── Образ фронта ────────────────────────────────────────────────────────────
  #
  # Собирается ЗДЕСЬ, а не на прод-сервере. На сервере 7,8 ГБ памяти на все
  # проекты, и сборка Next съедала её пиком у работающих сервисов: за сутки
  # 13.08 ядро убило по нехватке памяти 33 процесса, включая наш next-server
  # (дважды). Подкачка это смягчила, но лечение — не собирать на проде вовсе.
  #
  # Доставка через GHCR, а не `docker save | ssh docker load` как у ядра
  # (core#91): у ядра образ 307 МБ, у фронта два образа больше гигабайта, и
  # save шлёт их ЦЕЛИКОМ на каждый деплой через домашний канал раннера. push
  # отправляет только изменившиеся слои — базовые (node_modules, node:22-slim)
  # лежат в реестре и не двигаются. Это осознанное отклонение от формы ядра.
  #
  # Публичные NEXT_PUBLIC_* вшиваются в бандл ПРИ СБОРКЕ. Раньше их давал .env
  # сервера; теперь сборка идёт здесь, поэтому значения живут в variables
  # репозитория. Забыть их — молча потерять аналитику и абсолютные ссылки.
  image:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'workflow_dispatch'
    needs: [check]
    runs-on: [self-hosted, setfork]
    permissions:
      contents: read
      packages: write
    timeout-minutes: 40
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      # Повтор — из-за той же внешней зависимости, что и в `check`: сборка Next тянет
      # шрифты с fonts.googleapis.com, и с российских адресов это лотерея. Там повтор
      # уже стоит (и понадобился 30.07), здесь без него сорванная загрузка шрифта
      # останавливала бы ВЫКАТКУ. Настоящее лечение — держать шрифты у себя
      # (next/font/local), пока его нет — три попытки.
      - name: Сборка образов app и migrate (до 3 попыток — внешние шрифты)
        run: |
          build_app() {
            docker build --target runner \
            --build-arg NEXT_PUBLIC_SITE_URL='${{ vars.NEXT_PUBLIC_SITE_URL }}' \
            --build-arg NEXT_PUBLIC_UMAMI_URL='${{ vars.NEXT_PUBLIC_UMAMI_URL }}' \
            --build-arg NEXT_PUBLIC_UMAMI_WEBSITE_ID='${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}' \
              -t "$IMAGE:app-$GITHUB_SHA" .
          }
          for i in 1 2 3; do
            build_app && break
            [ $i -eq 3 ] && { echo "::error::образ app не собрался за 3 попытки"; exit 1; }
            echo "::notice::сборка образа сорвалась (попытка $i/3) — вероятно загрузка шрифтов; повторяю"
            sleep 15
          done
          # migrate сети не касается (ни сборки Next, ни шрифтов) — повтор ему не нужен.
          docker build --target migrate -t "$IMAGE:migrate-$GITHUB_SHA" .
      - name: Публикация в GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push "$IMAGE:app-$GITHUB_SHA"
          docker push "$IMAGE:migrate-$GITHUB_SHA"
          docker logout ghcr.io

  # ЗДЕСЬ, а не отдельным воркфлоу по `workflow_run`. Документация называет
  # назначение того события прямо: цепочка нужна, «when you need to perform
  # privileged actions in a subsequent workflow that the initial, less-privileged
  # workflow cannot access», то есть когда CI идёт на непривилегированном событии —
  # прежде всего `pull_request` из форка. Репозиторий приватный, форков ноль, CI
  # гоняется на своих раннерах: этого случая нет. Ядро переведено так же (core#91),
  # там форма обкатана и подтверждена живой выкаткой.
  #
  # ⚠️ Это НЕ то же, что «пуш и ждать CI внутри джобы». Тот подход пробовали 30.07 и
  # он провалился: джоба занимала раннер и 40 минут ждала прогон, стоявший в очереди
  # ЗА НЕЙ ЖЕ, два деплоя выели два раннера из пяти. `needs:` исполнителя не занимает —
  # джоба просто не стартует, пока зависимости не готовы.
  #
  # ЗАВИСИМОСТИ — `check` и `integration`, но НЕ `coverage`. 09.08 прод встал на двое
  # суток из-за одного флейкового теста в coverage: она входила в цепочку, хотя к
  # пригодности сборки отношения не имеет. Порог покрытия — вопрос качества кода,
  # а не готовности прода, и блокировать выкатку он не должен.
  deploy:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'workflow_dispatch'
    needs: [check, integration, image]
    runs-on: [self-hosted, setfork]
    # `queue: max` — штатный способ не терять прогоны: по умолчанию (`single`) в
    # группе ждёт РОВНО ОДИН, и каждая новая постановка отменяет предыдущего, то есть
    # выкатка коммита могла пропасть молча. docs: workflow-syntax → «Queueing multiple
    # pending runs» (`cancel-in-progress` с ним несовместим).
    concurrency:
      group: deploy-prod-frontend
      queue: max
    permissions:
      contents: read
      issues: write
      deployments: write
      # Пакет GHCR приватный (репозиторий приватный), а перечисление permissions
      # обнуляет всё неупомянутое: без этой строки `docker pull` в шаге доставки
      # получает отказ и выкатка встаёт до старта compose.
      packages: read
    # Потолок — про саму доставку и сборку на сервере; ожидания CI внутри джобы нет.
    timeout-minutes: 40
    env:
      DEPLOY: root@159.195.151.41
      APP_DIR: /root/setfork/src/setfork-frontend
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      # Очередь порядок завершения не выравнивает: два пуша подряд могут дойти сюда
      # не по порядку, и опоздавший собрал бы прод НАЗАД. Ручной запуск катит всегда —
      # его для того и зовут.
      - name: Прод свеж или его надо обновить?
        id: target
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha
            if (context.eventName === 'workflow_dispatch') {
              core.notice('ручной запуск — выкатываем без проверок свежести')
              core.setOutput('fresh', sha)
              return core.setOutput('sha', sha)
            }
            const { data: ref } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/master' })
            const tip = ref.object.sha
            if (tip !== sha) {
              core.notice(`master уже на ${tip.slice(0, 7)}, а это прогон ${sha.slice(0, 7)} — выкатит прогон вершины`)
              core.setOutput('fresh', '')
              return core.setOutput('sha', '')
            }
            // Эта ревизия уже на проде? Тогда пересобирать нечего: сборка идёт НА
            // СЕРВЕРЕ и занимает минуты, а `compose up` пересоздаёт контейнер, то
            // есть сайт на секунды теряет бэкенд. При этом прод СВЕЖ — и тревогу
            // снять надо, поэтому ответа два: что катить и что подтверждено свежим.
            const { data: deps } = await github.rest.repos.listDeployments({
              ...context.repo, sha, environment: 'production', per_page: 1,
            })
            let live = false
            if (deps.length) {
              const { data: states } = await github.rest.repos.listDeploymentStatuses({
                ...context.repo, deployment_id: deps[0].id, per_page: 1,
              })
              live = states[0]?.state === 'success'
            }
            core.setOutput('fresh', sha)
            if (live) {
              core.notice(`${sha.slice(0, 7)} уже выкачен — повторная сборка не нужна`)
              return core.setOutput('sha', '')
            }
            core.setOutput('sha', sha)

      - uses: actions/checkout@v4
        if: steps.target.outputs.sha != ''

      - name: 'Deployment: старт'
        id: dep
        if: steps.target.outputs.sha != ''
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { data: dep } = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: 'фронт на прод (tar по ssh + сборка на сервере)',
            })
            await github.rest.repos.createDeploymentStatus({
              ...context.repo, deployment_id: dep.id, state: 'in_progress',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
            core.setOutput('id', String(dep.id))

      - name: Ключ деплоя (ro-mount раннера)
        if: steps.target.outputs.sha != ''
        run: |
          test -f /ssh/setfork || { echo "::error::нет /ssh/setfork — подними раннер из setfork-ci-runner/docker-compose.yml (там ro-mount ключа)"; exit 1; }
          command -v ssh >/dev/null || (apt-get update -qq && apt-get install -y -qq openssh-client)
          install -m 600 /ssh/setfork /tmp/deploy_key

      # Дерево доставляется ЦЕЛИКОМ в новый каталог и подменяется, а не распаковывается
      # поверх старого. Причина: `tar -x` перезаписывает файлы, но НИКОГДА не удаляет —
      # стёртое в репозитории оставалось на сервере навсегда. Так деплой падал с 27.07:
      # удалённый в #487 BlockComments.tsx жил на сервере призраком, и `npm run build`
      # внутри Docker спотыкался о него на проверке типов при каждом пуше в master.
      #
      # ЧТО ЖИВЁТ ТОЛЬКО НА СЕРВЕРЕ (сверено сравнением дерева сервера с `git ls-files`
      # 29.07): .env и его бэкапы .env.bak*, плюс docker-compose.override.yml (права
      # 600, в репозитории его нет). Эти файлы переносим в новое дерево явно — но
      # override при этом НЕ подключается к compose (см. шаг запуска): он остаётся
      # только чтобы ничего не потерять, конфигурация живёт в репозитории.
      # .env.example НЕ переносим намеренно: он есть в репозитории, и версия из
      # репозитория должна побеждать серверную.
      # Прежнее дерево остаётся как .old на один цикл: если серверного файла всё же
      # не предусмотрели, он не потерян, а лежит рядом.
      - name: Доставка дерева → готовый образ из GHCR → up
        if: steps.target.outputs.sha != ''
        run: |
          SSH="ssh -i /tmp/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new $DEPLOY"
          tar --exclude=.git -czf - . | $SSH "rm -rf $APP_DIR.new && mkdir -p $APP_DIR.new && tar -xzf - -C $APP_DIR.new"
          $SSH "set -e
                for f in $APP_DIR/.env $APP_DIR/.env.bak* $APP_DIR/docker-compose.override.yml; do
                  test -e \$f && cp -a \$f $APP_DIR.new/ || true
                done
                rm -rf $APP_DIR.old
                if [ -d $APP_DIR ]; then mv $APP_DIR $APP_DIR.old; fi
                mv $APP_DIR.new $APP_DIR
                test -f $APP_DIR/.env || { echo '::error::на сервере нет $APP_DIR/.env — прежнее дерево в $APP_DIR.old'; exit 1; }"
          # ⚠️ ОБА -f ОБЯЗАТЕЛЬНЫ. На netcup маршрут живёт ТОЛЬКО в серверном
          # docker-compose.override.yml (traefik-labels: Host(`setfork.com`)), в
          # репозитории его нет. `up -d` с одним -f снимает ярлыки, Traefik теряет
          # бэкенд — и весь сайт отдаёт 404 при «healthy» контейнере.
          # Поэтому сначала убеждаемся, что файл на месте, и только потом поднимаем.
          #
          # --remove-orphans здесь НЕ используем: проектом setfork-frontend на этом
          # сервере частично управляет Dokploy, и «лишним» он может счесть чужой
          # контейнер.
          $SSH "test -f $APP_DIR/docker-compose.override.yml || { echo '::error::на сервере нет docker-compose.override.yml — в нём весь traefik-роутинг .com; без него сайт уйдёт в 404. Прежнее дерево в $APP_DIR.old'; exit 1; }"

          # Вход в реестр — ТОКЕНОМ ЭТОГО ПРОГОНА и через stdin: он живёт минуты,
          # на сервере не остаётся (logout ниже) и не светится в списке процессов.
          # Отдельный долгоживущий PAT на сервере заводить не потребовалось.
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | $SSH "docker login ghcr.io -u ${{ github.actor }} --password-stdin > /dev/null"
          $SSH "docker pull $IMAGE:app-$GITHUB_SHA && docker pull $IMAGE:migrate-$GITHUB_SHA"
          $SSH "docker logout ghcr.io > /dev/null"

          # Какие образы поднимать — отдельным файлом поверх остальных, как у ядра.
          # Он же документирует, что на проде крутится: тег совпадает с коммитом.
          $SSH "printf 'services:\n  app:\n    image: %s\n  migrate:\n    image: %s\n' \
                  '$IMAGE:app-$GITHUB_SHA' '$IMAGE:migrate-$GITHUB_SHA' > $APP_DIR/docker-compose.image.yml"

          # --no-build: сборки на проде больше нет, и если образа вдруг не окажется,
          # деплой обязан упасть, а не начать собирать — ради этого всё и затевалось.
          $SSH "cd $APP_DIR && docker compose -f docker-compose.dokploy.yml -f docker-compose.override.yml -f docker-compose.image.yml up -d --no-build"

          # Прежние теги накапливались бы на диске: держим два последних образа
          # каждого вида, остальные убираем. Текущий не трогаем — он используется.
          $SSH "docker images '$IMAGE' --format '{{.Tag}} {{.ID}}' | grep -E '^(app|migrate)-' | tail -n +5 | awk '{print \$2}' | xargs -r docker rmi -f >/dev/null 2>&1 || true"

      # Ждём НАСТОЯЩЕЙ готовности, а не фиксированную паузу.
      # Прежняя проверка была `sleep 10` + `grep -q 'healthy\|Up'`, и она пропускала
      # больной контейнер ДВАЖДЫ: строка `Up 3 hours (unhealthy)` содержит и `Up`,
      # и `healthy` (как подстроку `unhealthy`). То есть красный прод отдавал зелёный
      # деплой. Это тот же класс, что R8 линзы 08: ожидание, которое не ожидает.
      - name: Health-check
        if: steps.target.outputs.sha != ''
        run: |
          SSH="ssh -i /tmp/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new $DEPLOY"
          for i in $(seq 1 45); do
            STATE=$($SSH "docker inspect setfork-frontend --format '{{.State.Status}}/{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}'" 2>/dev/null || echo 'нет/контейнера')
            case "$STATE" in
              running/healthy) echo "фронт здоров через $((i * 2)) с"; exit 0 ;;
              running/none)    echo "фронт запущен (healthcheck у образа нет)"; exit 0 ;;
              running/starting) ;;
              *) echo "::notice::состояние $STATE" ;;
            esac
            sleep 2
          done
          echo "::error::фронт не стал здоровым за 90 с (последнее состояние: $STATE)"
          $SSH "docker logs --tail 50 setfork-frontend" || true
          exit 1

      # ТРЕВОГА О КРАСНОМ ДЕПЛОЕ. Появилась по факту: деплой падал на КАЖДОМ пуше в
      # master (VPN на self-hosted раннере → ssh 22 refused), прод стоял, и
      # обнаружилось это случайно — красная джоба сама себя никому не показывает.
      #
      # Канал — issue в этом же репозитории: не нужны ни секреты, ни внешние сервисы
      # (telegram с RF-IP недоступен без моста, почта — отдельная зависимость).
      # Всё через github-script, а не `gh`: раннер собран из чужого образа, CLI там
      # сегодня есть и завтра может не быть, а `command -v gh || exit 0` выключал бы
      # тревогу МОЛЧА — сигнальный механизм умирал бы так же тихо, как то, о чём он
      # сигналит (замечание авто-ревью на core#88).
      - name: Тревога — деплой упал
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const TITLE = '🔴 Деплой на прод падает'
            const sha = context.sha.slice(0, 7)
            const body = [
              `Деплой упал на \`${sha}\`.`,
              'Прод остался на предыдущей рабочей сборке (compose не заменяет контейнер при неудачной сборке).',
              '',
              `Лог: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Частая причина (уже ловили): VPN на self-hosted раннере → `ssh: connect to host … port 22: Connection refused`, сервер при этом жив.',
              'Проверка: `Test-NetConnection 159.195.151.41 -Port 22`. Лечение: выключить VPN и перезапустить джобу.',
              'Эта тревога закроется сама при следующем зелёном деплое.',
            ].join('\n')
            // Точное сравнение заголовка, а не search-запрос: поиск индексируется с
            // задержкой и на свежую тревогу отвечает пустотой — получались дубли.
            const open = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', per_page: 100 })
            const existing = open.find((i) => i.title === TITLE && !i.pull_request)
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body })
            } else {
              await github.rest.issues.create({ ...context.repo, title: TITLE, body })
            }

      # Зелёный деплой закрывает тревоги сам: иначе они живут вечно и перестают
      # что-либо значить — протухшая тревога хуже отсутствующей. Идёт по `fresh`,
      # поэтому срабатывает и когда катить было нечего (ревизия уже на проде):
      # иначе тревога, чьё закрытие однажды сорвалось, не закрылась бы никогда.
      - name: Снять тревоги — прод свежий
        if: success() && steps.target.outputs.fresh != ''
        uses: actions/github-script@v7
        with:
          script: |
            // Обе тревоги про одно состояние «прод не свежий»: успешная выкатка
            // снимает и ту, что про падение деплоя, и ту, что про пропущенный запуск.
            const TITLES = ['🔴 Деплой на прод падает', '🟠 Прод отстаёт от master: CI не зелёный']
            try {
              const open = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', per_page: 100 })
              for (const i of open.filter((x) => TITLES.includes(x.title) && !x.pull_request)) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: i.number,
                  body: `Деплой прошёл на \`${context.sha.slice(0, 7)}\` — прод снова свежий.`,
                })
                await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: 'closed' })
                core.notice(`тревога #${i.number} закрыта`)
              }
            } catch (e) {
              // Отказ ведёт в сторону ОТКРЫТОЙ тревоги: не сумели снять сигнал — пусть
              // висит, это честнее ложного «всё хорошо». Деплой уже прошёл, шаг не красим.
              core.warning(`не удалось снять тревоги (${e.message}) — оставлены открытыми`)
            }

      - name: Очистка ключа деплоя
        if: always()
        run: shred -u /tmp/deploy_key 2>/dev/null || rm -f /tmp/deploy_key

      - name: 'Deployment: итог'
        if: always() && steps.dep.outputs.id
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: Number(process.env.DEP_ID),
              state: process.env.JOB_STATUS === 'success' ? 'success' : 'failure',
              environment_url: 'https://setfork.com',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
        env:
          DEP_ID: ${{ steps.dep.outputs.id }}
          JOB_STATUS: ${{ job.status }}

  # Красный CI = выкатки не будет, и это надо отметить — но НЕ тревогой-issue.
  #
  # Тревога отвечает на вопрос «прод отстаёт?», то есть про СОСТОЯНИЕ, и живёт
  # по расписанию в `prod-stale.yml`. Здесь фиксируется СОБЫТИЕ: этот прогон не
  # довёз. Смешивать их в одном триггере нельзя — так и получилось, что тревога
  # срабатывала на каждом флейке (R6 линзы 08), а попытка добавить порог прямо
  # сюда заменила шум молчанием: без нового пуша условие не пересчитывалось
  # никогда (замечание авто-ревью на fe#787).
  stuck:
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      (needs.check.result != 'success' || needs.integration.result != 'success')
    needs: [check, integration]
    runs-on: [self-hosted, setfork]
    steps:
      - name: Отметить в сводке, что выкатка не состоялась
        uses: actions/github-script@v7
        env:
          R_CHECK: ${{ needs.check.result }}
          R_INTEGRATION: ${{ needs.integration.result }}
        with:
          script: |
            const failed = [['check', process.env.R_CHECK], ['integration', process.env.R_INTEGRATION]]
              .filter(([, r]) => r !== 'success')
              .map(([n]) => n)
              .join(', ')
            core.notice(`выкатка пропущена: упало ${failed || 'неизвестно'}`)
            await core.summary
              .addHeading('Выкатка не состоялась', 3)
              .addRaw('Упало: **' + (failed || 'неизвестно') + '** на ' + context.sha.slice(0, 7) + '.')
              .addBreak()
              .addRaw('Если прод так и останется позади, почасовая проверка `Прод отстаёт?` заведёт тревогу.')
              .write()
