name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: [self-hosted, setfork]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Плейсхолдеры: build динамических роутов к БД не ходит; нужны лишь для чтения env.
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-placeholder-secret-at-least-32-characters

  # Интеграция data-layer против реального Postgres (pgvector). Схема — drizzle-kit push
  # (не migrate: журнал миграций хрупкий, для эфемерной БД push надёжнее).
  integration:
    runs-on: [self-hosted, setfork]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        # ДИНАМИЧЕСКИЕ хост-порты (не '5432:5432'): раннеры core и frontend живут на
        # одной машине с общим docker-демоном, фиксированный порт давал гонку
        # «Bind for 0.0.0.0:5432 failed: port is already allocated» — падал тот job,
        # что стартовал вторым. Реальные порты берём из job.services (шаг ниже).
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379/tcp']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - name: URL сервисов (порты назначены рантаймом)
        run: |
          echo "DATABASE_URL=postgresql://ci:ci@localhost:${{ job.services.postgres.ports['5432'] }}/ci" >> "$GITHUB_ENV"
          echo "CI_REDIS_URL=redis://localhost:${{ job.services.redis.ports['6379'] }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Расширение vector нужно схеме (embeddings). Ставим через pg (уже в deps), без psql на раннере.
      - run: node -e "const{Client}=require('pg');(async()=>{const c=new Client(process.env.DATABASE_URL);await c.connect();await c.query('CREATE EXTENSION IF NOT EXISTS vector');await c.end()})().catch(e=>{console.error(e);process.exit(1)})"
      - run: npx drizzle-kit push --force
      - run: npm run test:integration
      # Redis-бэкенд rate-limit против настоящего Redis (Lua fixedWindow/tokenBucket).
      - run: npx vitest run tests/shared/rate-limit-store.redis.test.ts
        env:
          REDIS_URL: ${{ env.CI_REDIS_URL }}

  # Барьер покрытия: честная цифра = unit + integration (unit-репорт врёт 0% на data-layer).
  # Сливаем оба coverage-final.json и держим порог, чтобы покрытие не проседало.
  coverage:
    runs-on: [self-hosted, setfork]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        # Динамический порт — см. пояснение в job integration выше.
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: DATABASE_URL (порт назначен рантаймом)
        run: echo "DATABASE_URL=postgresql://ci:ci@localhost:${{ job.services.postgres.ports['5432'] }}/ci" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node -e "const{Client}=require('pg');(async()=>{const c=new Client(process.env.DATABASE_URL);await c.connect();await c.query('CREATE EXTENSION IF NOT EXISTS vector');await c.end()})().catch(e=>{console.error(e);process.exit(1)})"
      - run: npx drizzle-kit push --force
      - run: npm run coverage:unit
      - run: npm run coverage:integration
      - run: npm run coverage:check # порог --min из package.json
