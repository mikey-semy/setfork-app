name: Smoke (setfork-sim)

# ОТДЕЛЬНЫЙ workflow, НЕ входит в required-checks основного CI (ci.yml) —
# полный стек + Playwright склонны к флаки, и они не должны блокировать чужие PR.
# Гоняет сценарии c1–c6 из репо setfork-sim против свежесобранного фронта
# (POLYGON_URL=localhost, inproc-git через системный git — Rust-ядро не нужно).
#
# ТРЕБУЕТ секрет репозитория SIM_REPO_TOKEN — fine-grained PAT с read-доступом к
# contents репо mikey-semy/setfork-sim (кросс-репо checkout приватного репо;
# дефолтный GITHUB_TOKEN туда не ходит). Без него шаг checkout sim упадёт.

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

jobs:
  smoke:
    runs-on: [self-hosted, setfork]
    env:
      AUTH_SECRET: ci-placeholder-secret-at-least-32-characters-long
      POLYGON_URL: http://localhost:3000
      SIM_PROXY: 'off' # прокси нужен только для демо-стенда; локалхост — напрямую
      # SETFORK_CORE_URL НЕ задаём → фронт использует inproc-git (системный git)
    steps:
      # `services:` тут не годятся: раннер сам в контейнере (sibling-демон), их
      # порты публикуются на ХОСТЕ, а localhost внутри раннера — это он сам.
      # Поднимаем Postgres своей сетью и подключаем к ней раннер (как в core).
      # pgvector-образ: схема использует тип vector (embeddings).
      - name: Postgres (sibling-контейнер в сети раннера)
        run: |
          NET="ci-${GITHUB_RUN_ID}-smoke"
          docker network create "$NET" >/dev/null 2>&1 || true
          docker rm -f "pg-$NET" >/dev/null 2>&1 || true
          docker run -d --name "pg-$NET" --network "$NET" \
            -e POSTGRES_USER=sf -e POSTGRES_PASSWORD=sf -e POSTGRES_DB=sf \
            pgvector/pgvector:pg16 >/dev/null
          docker network connect "$NET" "$(hostname)" >/dev/null 2>&1 || true
          for i in $(seq 1 60); do
            docker exec "pg-$NET" pg_isready -U sf >/dev/null 2>&1 && break
            sleep 1
          done
          echo "CI_NET=$NET" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgres://sf:sf@pg-$NET:5432/sf" >> "$GITHUB_ENV"

      - name: Checkout frontend
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Apply DB schema (drizzle export → psql)
        # push интерактивен (TTY), migrate падает на журнале миграций (известная
        # хрупкость) — детерминированно дампим полный DDL из schema.ts и накатываем.
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector;"
          npx drizzle-kit export > "$RUNNER_TEMP/schema.sql"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/schema.sql"

      - name: Build
        run: npm run build

      - name: Start frontend
        run: |
          git config --global user.email "sim@setfork.com"
          git config --global user.name "SetFork Sim"
          npm start > "$RUNNER_TEMP/frontend.log" 2>&1 &
          # Готовность = сервер принимает соединения (любой HTTP-статус), не только 2xx.
          for i in $(seq 1 45); do
            curl -s -o /dev/null http://localhost:3000 && { echo "frontend up"; exit 0; }
            sleep 2
          done
          echo "frontend did not come up in time"; cat "$RUNNER_TEMP/frontend.log"; exit 1

      - name: Checkout setfork-sim
        uses: actions/checkout@v4
        with:
          repository: mikey-semy/setfork-sim
          token: ${{ secrets.SIM_REPO_TOKEN }}
          path: _sim

      - name: Run smoke (c1–c6)
        working-directory: _sim
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run smoke

      - name: Frontend log (on failure)
        if: failure()
        run: cat "$RUNNER_TEMP/frontend.log" || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: _sim/playwright-report
          if-no-files-found: ignore

      - name: cleanup (контейнер и сеть)
        if: always()
        run: |
          docker rm -f "pg-${CI_NET}" >/dev/null 2>&1 || true
          docker network disconnect "${CI_NET}" "$(hostname)" >/dev/null 2>&1 || true
          docker network rm "${CI_NET}" >/dev/null 2>&1 || true
