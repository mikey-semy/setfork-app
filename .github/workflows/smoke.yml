name: Smoke (setfork-sim)

# ОТДЕЛЬНЫЙ workflow, НЕ входит в required-checks основного CI (ci.yml) —
# полный стек + Playwright склонны к флаки, и они не должны блокировать чужие PR.
# Гоняет сценарии c1–c6 из репо setfork-sim против свежесобранного фронта
# (POLYGON_URL=localhost, inproc-git через системный git — Rust-ядро не нужно).
#
# ТРЕБУЕТ секрет репозитория SIM_REPO_TOKEN — fine-grained PAT с read-доступом к
# contents репо mikey-semy/setfork-sim (кросс-репо checkout приватного репо;
# дефолтный GITHUB_TOKEN туда не ходит). Без него шаг checkout sim упадёт.

# НЕ на каждый PR: полный стек + Playwright занимают раннер ~25 минут, а сценарии
# ловят регресс продукта, а не конкретной правки. На PR это только очередь. Гоняем
# ночью, на push в master и руками, когда трогали пользовательский путь.
on:
  workflow_dispatch:
    inputs:
      # Скриншоты UI Kit (c9, Ф7b): off — не гонять; compare — сверка с
      # эталонами sim; update — перегенерить эталоны (бутстрап/осознанное
      # обновление; снимки забрать из артефакта uikit-snapshots и закоммитить
      # в sim — runbook ui-kit-screens в HQ).
      screens:
        description: 'Скриншоты UI Kit: off | compare | update'
        required: false
        default: 'compare'
        type: choice
        options: ['off', 'compare', 'update']
  schedule:
    - cron: '0 2 * * *'
  push:
    branches: [master]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: [self-hosted, setfork]
    env:
      AUTH_SECRET: ci-placeholder-secret-at-least-32-characters-long
      POLYGON_URL: http://localhost:3000
      # Сквозной прогон логинит одни и те же персоны десятками раз (у каждого цикла
      # свой контекст браузера), и штатный потолок в 10 попыток за 15 минут они
      # выбирают к середине набора — дальше вход отвечает «неверные данные», и
      # сценарии падают на ровном месте. Для стенда потолок поднят; прод и dev
      # живут на значении по умолчанию.
      SETFORK_LOGIN_ATTEMPTS: '500'
      SIM_PROXY: 'off' # прокси нужен только для демо-стенда; локалхост — напрямую
      # Ф7b (ui-system): c9-сценарий sim смотрит /admin/ui-kit под этим админом.
      # Скриншот-сравнение включается SIM_SCREENS=1 после бутстрапа эталонов
      # (runbook ui-kit-screens в HQ); дым-часть c9 работает всегда.
      ADMIN_HANDLES: e2e-admin
    steps:
      # `services:` тут не годятся: раннер сам в контейнере (sibling-демон), их
      # порты публикуются на ХОСТЕ, а localhost внутри раннера — это он сам.
      # Поднимаем Postgres своей сетью и подключаем к ней раннер (как в core).
      # pgvector-образ: схема использует тип vector (embeddings).
      - name: Postgres (sibling-контейнер в сети раннера)
        run: |
          NET="ci-${GITHUB_RUN_ID}-smoke"
          docker network create "$NET" >/dev/null 2>&1 || true
          docker rm -f "pg-$NET" >/dev/null 2>&1 || true
          docker run -d --name "pg-$NET" --network "$NET" \
            -e POSTGRES_USER=sf -e POSTGRES_PASSWORD=sf -e POSTGRES_DB=sf \
            pgvector/pgvector:pg16 >/dev/null
          docker network connect "$NET" "$(hostname)" >/dev/null 2>&1 || true
          for i in $(seq 1 60); do
            docker exec "pg-$NET" pg_isready -U sf >/dev/null 2>&1 && break
            sleep 1
          done
          echo "CI_NET=$NET" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgres://sf:sf@pg-$NET:5432/sf" >> "$GITHUB_ENV"

      - name: Checkout frontend
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # cache: npm НЕ используем: на self-hosted раннере это скачивание архива
          # кэша из GitHub (из РФ — минуты на джобу). Вместо него ~/.npm смонтирован
          # персистентным томом раннера (setfork-ci-runner/docker-compose.yml), а
          # установка идёт --prefer-offline.

      - name: Install deps
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Apply DB schema (drizzle export → psql)
        # push интерактивен (TTY), migrate падает на журнале миграций (известная
        # хрупкость) — детерминированно дампим полный DDL из schema.ts и накатываем.
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          # Бутстрап вне схемы (линза 07): расширения до DDL, канон поиска (0028) после.
          npx tsx scripts/db-bootstrap.ts pre
          npx drizzle-kit export > "$RUNNER_TEMP/schema.sql"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/schema.sql"
          npx tsx scripts/db-bootstrap.ts post

      # Админ для c9 (UI Kit) сидируется НАПРЯМУЮ: регистрация ников из
      # ADMIN_HANDLES запрещена самим приложением (защита свободного
      # админ-ника), поэтому c9 логинится, а не регистрируется.
      - name: Seed e2e-admin (для c9 UI Kit)
        run: |
          HASH=$(node -e 'const {randomBytes,scryptSync}=require("crypto");const s=randomBytes(16);console.log(["scrypt",s.toString("hex"),scryptSync("e2e-admin-pass-1",s,64).toString("hex")].join("$"))')
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO users (handle, email, name, password_hash, email_verified_at) VALUES ('e2e-admin', 'e2e-admin@sim.invalid', 'E2E Admin', '$HASH', now()) ON CONFLICT DO NOTHING;"

      # Ядро обязательно с Ф0b git-трека (inproc удалён): без него создание
      # списка падает — c1 и был вечно красным. Тот же sibling, что в ci.yml.
      - name: setfork-core (sibling из GHCR — git-first запись версий)
        run: |
          IMAGE=ghcr.io/mikey-semy/setfork-core:latest
          docker pull "$IMAGE" >/dev/null 2>&1 || true
          docker rm -f "core-$CI_NET" >/dev/null 2>&1 || true
          docker run -d --name "core-$CI_NET" --network "$CI_NET" \
            -e DATABASE_URL="postgresql://sf:sf@pg-$CI_NET:5432/sf" \
            -e SETFORK_ALLOW_INSECURE=1 \
            "$IMAGE" >/dev/null
          for i in $(seq 1 60); do
            docker logs "core-$CI_NET" 2>&1 | grep -q "слушает" && { echo "core up"; break; }
            sleep 1
          done
          docker logs "core-$CI_NET" 2>&1 | tail -3
          echo "SETFORK_CORE_URL=1" >> "$GITHUB_ENV"
          echo "SETFORK_CORE_ADDR=core-$CI_NET:50051" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Start frontend
        run: |
          git config --global user.email "sim@setfork.com"
          git config --global user.name "SetFork Sim"
          npm start > "$RUNNER_TEMP/frontend.log" 2>&1 &
          # Готовность = сервер принимает соединения (любой HTTP-статус), не только 2xx.
          for i in $(seq 1 45); do
            curl -s -o /dev/null http://localhost:3000 && { echo "frontend up"; exit 0; }
            sleep 2
          done
          echo "frontend did not come up in time"; cat "$RUNNER_TEMP/frontend.log"; exit 1

      - name: Checkout setfork-sim
        uses: actions/checkout@v4
        with:
          repository: mikey-semy/setfork-sim
          token: ${{ secrets.SIM_REPO_TOKEN }}
          path: _sim

      - name: Run smoke (c1–c9)
        working-directory: _sim
        env:
          # push/schedule: compare (гейт визуальной регрессии всегда включён
          # после бутстрапа эталонов); dispatch может выключить или обновить.
          SCREENS_MODE: ${{ inputs.screens || 'compare' }}
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npx playwright install --with-deps chromium
          if [ "$SCREENS_MODE" != "off" ]; then export SIM_SCREENS=1; fi
          if [ "$SCREENS_MODE" = "update" ]; then
            npm run smoke -- --update-snapshots
          else
            npm run smoke
          fi

      - name: Frontend log (on failure)
        if: failure()
        run: cat "$RUNNER_TEMP/frontend.log" || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: _sim/playwright-report
          if-no-files-found: ignore

      # Эталоны/актуальные снимки UI Kit (c9): при бутстрапе (--update-snapshots)
      # отсюда забираются базовые снимки для коммита в sim; при расхождении —
      # диффы для глаз.
      - name: Upload UI Kit snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uikit-snapshots
          path: _sim/scenarios/*-snapshots
          if-no-files-found: ignore

      - name: cleanup (контейнер и сеть)
        if: always()
        run: |
          docker rm -f "pg-${CI_NET}" "core-${CI_NET}" >/dev/null 2>&1 || true
          docker network disconnect "${CI_NET}" "$(hostname)" >/dev/null 2>&1 || true
          docker network rm "${CI_NET}" >/dev/null 2>&1 || true
