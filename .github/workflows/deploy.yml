# Автодеплой на прод setfork.com (159.195.151.41, netcup) на КАЖДЫЙ пуш в master.
#
# ⚠️ ЦЕЛЬ СМЕНИЛАСЬ 09.08.2026. Канон вернулся на setfork.com ещё 04.08 (ADR-0017), а
# выкатка всё это время ехала на 31.177.83.219 (.ru) — то есть уже не на прод. Сам .com
# обновлялся вебхуком Dokploy, и после переезда на netcup вебхука в репозитории не стало:
# с 07.08 16:04 на канон не выкатывалось НИЧЕГО, при том что каждый деплой был зелёный.
# Теперь цель одна и та же, что и канон; .ru из выкатки убран (решение владельца 09.08).
#
# Триггер — ЗАВЕРШЕНИЕ воркфлоу CI на master (`workflow_run`), а не пуш. Перед
# доставкой стоят два гейта (оба из авто-ревью, #468 и #321):
#
# 1. ЗЕЛЁНЫЙ CI ЭТОГО ЖЕ КОММИТА. По пушу деплой уезжал, не спрашивая проверок:
#    сборка на сервере ловит только то, что не компилируется, а красные тесты, линт и
#    разъехавшийся proto попадали на прод беспрепятственно.
#
#    Гейт когда-то стоял на `workflow_run` и был снят, потому что master-CI отменялся
#    `cancel-in-progress` и деплой вечно оказывался skipped. Это уже исправлено:
#    на master прогон не отменяется (см. ci.yml).
#
#    Пробовать вместо этого «пуш + ждать CI внутри джобы» НЕЛЬЗЯ, и это проверено
#    вживую 30.07: джоба заняла раннер и 40 минут ждала прогон, который стоял в
#    очереди ЗА НЕЙ ЖЕ. Два таких деплоя выели два раннера из пяти и упали по
#    таймауту, ничего не выкатив. Ожидание не должно занимать исполнителя.
#
# 2. КОММИТ ВСЁ ЕЩЁ ВЕРШИНА master. Очередь деплоя не гарантирует порядок (о чём
#    прямо сказано в документации про concurrency), поэтому опоздавший прогон
#    старого коммита мог собрать прод НАЗАД. Устаревший деплой уступает свежему.
#
# Сборка `--build` идёт НА СЕРВЕРЕ; `compose up` не заменит рабочий контейнер, если
# сборка упала — прод остаётся на последней рабочей версии, а джоба краснеет.
#
# Исходники уезжают tar-ом по ssh в /root/setfork/src/setfork-frontend, образ
# собирается НА СЕРВЕРЕ (npm registry с RF-сервера работает; .env сервиса лежит
# на сервере и tar-ом не затирается). Ключ деплоя приходит ro-mount'ом из
# setfork-ci-runner/docker-compose.yml (/ssh/setfork) — GitHub Secrets не нужны. Публичная
# часть этого ключа заведена в /root/.ssh/authorized_keys на netcup 09.08.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  # Ручной запуск: когда нужно выкатить текущий master без нового коммита
  # (например после починки самого воркфлоу).
  workflow_dispatch:

# Один деплой за раз (никогда не параллелим прод), но БЕЗ cancel-in-progress:
# оборвать deploy на середине `compose up` = риск полуподнятого контейнера.
# Мержи копятся в очередь и катятся по одному, прод сходится к последнему коммиту.
concurrency:
  group: deploy-prod-frontend
  cancel-in-progress: false

env:
  DEPLOY: root@159.195.151.41
  APP_DIR: /root/setfork/src/setfork-frontend

# В контексте workflow_run `github.sha` — вершина master на момент события, а нужен
# коммит, который проверял CI: он в github.event.workflow_run.head_sha. Отсюда эта
# конструкция во всех шагах ниже.
jobs:
  # Деплой с красным CI не идёт — это правильно, но раньше он просто «не случался»
  # и никто не узнавал: прод молча оставался на позавчерашнем коммите (09.08 так и
  # вышло — один флейковый тест в coverage, и вся выкатка встала без единого следа).
  # Молчаливая непрокатка хуже упавшей: упавшая хотя бы краснеет.
  stuck:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
    runs-on: [self-hosted, setfork]
    permissions:
      contents: read
      issues: write
    steps:
      - name: Тревога — выкатка не состоялась
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: '🟠 Прод отстаёт от master: CI не зелёный'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RESULT: ${{ github.event.workflow_run.conclusion }}
        run: |
          command -v gh >/dev/null || { echo "::warning::нет gh CLI на раннере — тревога не отправлена"; exit 0; }
          BODY="CI на master завершился как \`$RESULT\` на \`${SHA:0:7}\` — деплой пропущен, прод остался на прошлом коммите.

          Прогон CI: $RUN_URL

          Что делать: посмотреть, что упало. Если это флейк (чаще всего таймаут хука в itest на загруженном раннере) — перезапустить упавшую джобу: \`gh run rerun <id> --failed\`; зелёный прогон сам утянет деплой. Если падение настоящее — чинить и пушить.
          Выкатить текущий master без нового коммита можно вручную: \`gh workflow run deploy.yml\`.
          Эта тревога закроется сама при следующем зелёном деплое."
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --body "$BODY" || echo "::warning::не удалось дописать в тревогу #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY" || echo "::warning::не удалось создать тревогу"
          fi

  deploy:
    runs-on: [self-hosted, setfork]
    # Красный/отменённый CI до деплоя не доходит вовсе. Ручной запуск идёт без условия.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # issues: write — для тревоги о красном деплое (шаг ниже).
    # deployments: write — витрина Deployments в сайдбаре GitHub (история выкаток).
    permissions:
      contents: read
      issues: write
      deployments: write
    # Ожидания CI внутри джобы больше нет: сюда попадают только после его вердикта.
    # Потолок — про саму доставку и сборку на сервере.
    timeout-minutes: 40
    steps:
      # Едет ИМЕННО тот коммит, который проверял CI (в workflow_run github.sha — вершина
      # master, она могла уже уехать вперёд).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Коммит всё ещё вершина master?
        id: fresh
        uses: actions/github-script@v7
        with:
          script: |
            // Очередь деплоя не гарантирует порядок: опоздавший прогон старого коммита
            // собрал бы прод НАЗАД. Если master уже ушёл вперёд — уступаем свежему.
            const mine = process.env.DEPLOY_SHA
            const { data: ref } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/master' })
            const tip = ref.object.sha
            const ok = tip === mine
            if (!ok) core.notice(`master уже на ${tip.slice(0, 7)}, а это прогон ${mine.slice(0, 7)} — деплой уступает свежему коммиту`)
            core.setOutput('ok', String(ok))
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

      # GitHub Deployment — только витрина/история в сайдбаре: сам деплой от него
      # не зависит, сбой API не роняет доставку (continue-on-error). Уступивший
      # прогон (fresh != ok) записи не создаёт — он ничего не катит.
      - name: 'Deployment: старт'
        id: dep
        if: steps.fresh.outputs.ok == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { data: dep } = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: process.env.DEPLOY_SHA,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: 'фронт на прод (tar по ssh + сборка на сервере)',
            })
            await github.rest.repos.createDeploymentStatus({
              ...context.repo, deployment_id: dep.id, state: 'in_progress',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
            core.setOutput('id', String(dep.id))
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Ключ деплоя (ro-mount раннера)
        if: steps.fresh.outputs.ok == 'true'
        run: |
          test -f /ssh/setfork || { echo "::error::нет /ssh/setfork — подними раннер из setfork-ci-runner/docker-compose.yml (там ro-mount ключа)"; exit 1; }
          command -v ssh >/dev/null || (apt-get update -qq && apt-get install -y -qq openssh-client)
          install -m 600 /ssh/setfork /tmp/deploy_key

      # Дерево доставляется ЦЕЛИКОМ в новый каталог и подменяется, а не распаковывается
      # поверх старого. Причина: `tar -x` перезаписывает файлы, но НИКОГДА не удаляет —
      # стёртое в репозитории оставалось на сервере навсегда. Так деплой падал с 27.07:
      # удалённый в #487 BlockComments.tsx жил на сервере призраком, и `npm run build`
      # внутри Docker спотыкался о него на проверке типов при каждом пуше в master.
      #
      # ЧТО ЖИВЁТ ТОЛЬКО НА СЕРВЕРЕ (сверено сравнением дерева сервера с `git ls-files`
      # 29.07): .env и его бэкапы .env.bak*, плюс docker-compose.override.yml (права
      # 600, в репозитории его нет). Эти файлы переносим в новое дерево явно — но
      # override при этом НЕ подключается к compose (см. шаг запуска): он остаётся
      # только чтобы ничего не потерять, конфигурация живёт в репозитории.
      # .env.example НЕ переносим намеренно: он есть в репозитории, и версия из
      # репозитория должна побеждать серверную.
      # Прежнее дерево остаётся как .old на один цикл: если серверного файла всё же
      # не предусмотрели, он не потерян, а лежит рядом.
      - name: Доставка исходников → сборка на сервере → up
        if: steps.fresh.outputs.ok == 'true'
        run: |
          SSH="ssh -i /tmp/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new $DEPLOY"
          tar --exclude=.git -czf - . | $SSH "rm -rf $APP_DIR.new && mkdir -p $APP_DIR.new && tar -xzf - -C $APP_DIR.new"
          $SSH "set -e
                for f in $APP_DIR/.env $APP_DIR/.env.bak* $APP_DIR/docker-compose.override.yml; do
                  test -e \$f && cp -a \$f $APP_DIR.new/ || true
                done
                rm -rf $APP_DIR.old
                if [ -d $APP_DIR ]; then mv $APP_DIR $APP_DIR.old; fi
                mv $APP_DIR.new $APP_DIR
                test -f $APP_DIR/.env || { echo '::error::на сервере нет $APP_DIR/.env — прежнее дерево в $APP_DIR.old'; exit 1; }"
          # ⚠️ ОБА -f ОБЯЗАТЕЛЬНЫ. На netcup маршрут живёт ТОЛЬКО в серверном
          # docker-compose.override.yml (traefik-labels: Host(`setfork.com`)), в
          # репозитории его нет. `up -d` с одним -f снимает ярлыки, Traefik теряет
          # бэкенд — и весь сайт отдаёт 404 при «healthy» контейнере.
          # Поэтому сначала убеждаемся, что файл на месте, и только потом поднимаем.
          #
          # --remove-orphans здесь НЕ используем: проектом setfork-frontend на этом
          # сервере частично управляет Dokploy, и «лишним» он может счесть чужой
          # контейнер.
          $SSH "test -f $APP_DIR/docker-compose.override.yml || { echo '::error::на сервере нет docker-compose.override.yml — в нём весь traefik-роутинг .com; без него сайт уйдёт в 404. Прежнее дерево в $APP_DIR.old'; exit 1; }"
          $SSH "cd $APP_DIR && docker compose -f docker-compose.dokploy.yml -f docker-compose.override.yml up -d --build"
          # Кэш сборки чистим СРАЗУ после сборки. Образ собирается на сервере, и кэш
          # растёт с каждым деплоем без потолка: 29.07 он занял 15 ГБ из 35 и вывел
          # диск на 80%, а авто-чистка мониторинга включается только с 90%.
          # Оставляем свежее (сутки) — следующая сборка не начнётся с нуля.
          $SSH "docker builder prune -f --filter until=24h >/dev/null 2>&1 || true"

      - name: Health-check
        if: steps.fresh.outputs.ok == 'true'
        run: |
          SSH="ssh -i /tmp/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new $DEPLOY"
          sleep 10
          $SSH "docker ps --filter name=setfork-frontend --format '{{.Names}} {{.Status}}' | grep -q 'healthy\|Up' " || { echo "::error::контейнер фронта не поднялся"; $SSH "docker logs --tail 50 setfork-frontend"; exit 1; }

      # ТРЕВОГА О КРАСНОМ ДЕПЛОЕ. Появилась по факту: деплой падал на КАЖДОМ пуше в
      # master (VPN на раннере → ssh 22 refused), прод стоял, и обнаружилось это
      # случайно — красная джоба сама себя никому не показывает.
      #
      # Канал — issue в этом же репо: не нужны ни секреты, ни внешние сервисы
      # (telegram с RF-IP недоступен без моста, почта — отдельная зависимость).
      # Дедуп по заголовку: повторные падения идут КОММЕНТАРИЕМ в открытую тревогу,
      # иначе очередь мержей завалила бы трекер копиями.
      - name: Тревога — деплой упал
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: '🔴 Деплой на прод падает'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          command -v gh >/dev/null || { echo "::warning::нет gh CLI на раннере — тревога не отправлена"; exit 0; }
          BODY="Деплой упал на \`${SHA:0:7}\`.
          Прод остался на предыдущей рабочей сборке (compose не заменяет контейнер при неудачной сборке).

          Лог: $RUN_URL

          Частая причина (уже ловили): VPN на self-hosted раннере → \`ssh: connect to host … port 22: Connection refused\`, сервер при этом жив. Проверка: \`Test-NetConnection 159.195.151.41 -Port 22\`. Лечение: выключить VPN и перезапустить джобу.
          Эта тревога закроется сама при следующем зелёном деплое."
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --body "$BODY" || echo "::warning::не удалось дописать в тревогу #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY" || echo "::warning::не удалось создать тревогу"
          fi

      - name: 'Deployment: итог'
        if: always() && steps.dep.outputs.id
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: Number(process.env.DEP_ID),
              state: process.env.JOB_STATUS === 'success' ? 'success' : 'failure',
              environment_url: 'https://setfork.ru',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
        env:
          DEP_ID: ${{ steps.dep.outputs.id }}
          JOB_STATUS: ${{ job.status }}

      # Зелёный деплой закрывает тревогу сам: иначе она живёт вечно и перестаёт
      # что-либо значить — а протухшая тревога хуже отсутствующей.
      - name: Снять тревогу — деплой прошёл
        # Уступивший старый прогон тревогу НЕ снимает: он ничего не катил, и его
        # «успех» не означает, что прод здоров.
        if: success() && steps.fresh.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE_FAIL: '🔴 Деплой на прод падает'
          TITLE_STUCK: '🟠 Прод отстаёт от master: CI не зелёный'
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          command -v gh >/dev/null || exit 0
          # Обе тревоги про одно состояние «прод не свежий»: успешная выкатка снимает
          # и ту, что про падение деплоя, и ту, что про пропущенный запуск.
          close_alert() {
            EXISTING=$(gh issue list --state open --search "$1 in:title" --json number --jq '.[0].number' 2>/dev/null || true)
            if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
              gh issue close "$EXISTING" --comment "Деплой прошёл на \`${SHA:0:7}\` — прод снова свежий." || true
            fi
          }
          close_alert "$TITLE_FAIL"
          close_alert "$TITLE_STUCK"
