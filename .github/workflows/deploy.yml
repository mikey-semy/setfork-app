# Автодеплой на прод setfork (31.177.83.219, без Dokploy) на КАЖДЫЙ пуш в master.
#
# Триггер — push (не workflow_run CI): раньше Deploy ждал завершения воркфлоу CI,
# но `cancel-in-progress` + частые мержи параллельных сессий отменяли master-CI
# за 2-4 мин (не доживал до конца) → Deploy вечно skipped, автодеплой не работал.
# Теперь деплой не зависит от гонки CI. Гейт качества: (1) PR-CI зелёный ПЕРЕД
# мержем (linkcheck-флейк починен, CI снова доверяемый); (2) сборка `--build` идёт
# НА СЕРВЕРЕ — битый код не соберётся, а `compose up` НЕ заменит рабочий контейнер
# (прод остаётся на последней рабочей сборке, джоба краснеет — видно).
#
# Исходники уезжают tar-ом по ssh в /opt/setfork/src/setfork-frontend, образ
# собирается НА СЕРВЕРЕ (npm registry с RF-сервера работает; .env сервиса лежит
# на сервере и tar-ом не затирается). Ключ деплоя приходит ro-mount'ом из
# setfork-ci-runner/docker-compose.yml (/ssh/setfork) — GitHub Secrets не нужны.
name: Deploy

on:
  push:
    branches: [master]

# Один деплой за раз (никогда не параллелим прод), но БЕЗ cancel-in-progress:
# оборвать deploy на середине `compose up` = риск полуподнятого контейнера.
# Мержи копятся в очередь и катятся по одному, прод сходится к последнему коммиту.
concurrency:
  group: deploy-prod-frontend
  cancel-in-progress: false

env:
  DEPLOY: root@31.177.83.219
  APP_DIR: /opt/setfork/src/setfork-frontend

jobs:
  deploy:
    runs-on: [self-hosted, setfork]
    # issues: write — для тревоги о красном деплое (шаг ниже). Остальное read.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Ключ деплоя (ro-mount раннера)
        run: |
          test -f /ssh/setfork || { echo "::error::нет /ssh/setfork — подними раннер из setfork-ci-runner/docker-compose.yml (там ro-mount ключа)"; exit 1; }
          command -v ssh >/dev/null || (apt-get update -qq && apt-get install -y -qq openssh-client)
          install -m 600 /ssh/setfork /tmp/deploy_key

      # Дерево доставляется ЦЕЛИКОМ в новый каталог и подменяется, а не распаковывается
      # поверх старого. Причина: `tar -x` перезаписывает файлы, но НИКОГДА не удаляет —
      # стёртое в репозитории оставалось на сервере навсегда. Так деплой падал с 27.07:
      # удалённый в #487 BlockComments.tsx жил на сервере призраком, и `npm run build`
      # внутри Docker спотыкался о него на проверке типов при каждом пуше в master.
      #
      # ЧТО ЖИВЁТ ТОЛЬКО НА СЕРВЕРЕ (сверено сравнением дерева сервера с `git ls-files`
      # 29.07): .env и его бэкапы .env.bak*, плюс docker-compose.override.yml (права
      # 600, в репозитории его нет). Эти файлы переносим в новое дерево явно.
      # .env.example НЕ переносим намеренно: он есть в репозитории, и версия из
      # репозитория должна побеждать серверную.
      # Прежнее дерево остаётся как .old на один цикл: если серверного файла всё же
      # не предусмотрели, он не потерян, а лежит рядом.
      - name: Доставка исходников → сборка на сервере → up
        run: |
          SSH="ssh -i /tmp/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new $DEPLOY"
          tar --exclude=.git -czf - . | $SSH "rm -rf $APP_DIR.new && mkdir -p $APP_DIR.new && tar -xzf - -C $APP_DIR.new"
          $SSH "set -e
                for f in $APP_DIR/.env $APP_DIR/.env.bak* $APP_DIR/docker-compose.override.yml; do
                  test -e \$f && cp -a \$f $APP_DIR.new/ || true
                done
                rm -rf $APP_DIR.old
                if [ -d $APP_DIR ]; then mv $APP_DIR $APP_DIR.old; fi
                mv $APP_DIR.new $APP_DIR
                test -f $APP_DIR/.env || { echo '::error::на сервере нет $APP_DIR/.env — прежнее дерево в $APP_DIR.old'; exit 1; }"
          # docker-compose.override.yml ПОДКЛЮЧАЕМ ЯВНО. Compose подхватывает override
          # сам только для пары docker-compose.yml + override; с явным -f он его
          # игнорирует — молча. На проде в override живёт RU-мост
          # (extra_hosts: openrouter.ai → equiply), потому что OpenRouter отдаёт 403 на
          # российский IP. Мост не применялся: у контейнера extra_hosts было пусто, и
          # админка показывала «каталог моделей не загрузился (403)», а выглядело это
          # как «неверный ключ». Файл серверный, в репозитории его нет — включаем, только
          # если он есть.
          $SSH "cd $APP_DIR && test -f docker-compose.override.yml && echo -f docker-compose.override.yml > /tmp/sf-override.args || : >/tmp/sf-override.args"
          $SSH "cd $APP_DIR && docker compose -f docker-compose.dokploy.yml \$(cat /tmp/sf-override.args) up -d --build --remove-orphans"
          # Кэш сборки чистим СРАЗУ после сборки. Образ собирается на сервере, и кэш
          # растёт с каждым деплоем без потолка: 29.07 он занял 15 ГБ из 35 и вывел
          # диск на 80%, а авто-чистка мониторинга включается только с 90%.
          # Оставляем свежее (сутки) — следующая сборка не начнётся с нуля.
          $SSH "docker builder prune -f --filter until=24h >/dev/null 2>&1 || true"

      - name: Health-check
        run: |
          SSH="ssh -i /tmp/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new $DEPLOY"
          sleep 10
          $SSH "docker ps --filter name=setfork-frontend --format '{{.Names}} {{.Status}}' | grep -q 'healthy\|Up' " || { echo "::error::контейнер фронта не поднялся"; $SSH "docker logs --tail 50 setfork-frontend"; exit 1; }

      # ТРЕВОГА О КРАСНОМ ДЕПЛОЕ. Появилась по факту: деплой падал на КАЖДОМ пуше в
      # master (VPN на раннере → ssh 22 refused), прод стоял, и обнаружилось это
      # случайно — красная джоба сама себя никому не показывает.
      #
      # Канал — issue в этом же репо: не нужны ни секреты, ни внешние сервисы
      # (telegram с RF-IP недоступен без моста, почта — отдельная зависимость).
      # Дедуп по заголовку: повторные падения идут КОММЕНТАРИЕМ в открытую тревогу,
      # иначе очередь мержей завалила бы трекер копиями.
      - name: Тревога — деплой упал
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: '🔴 Деплой на прод падает'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          command -v gh >/dev/null || { echo "::warning::нет gh CLI на раннере — тревога не отправлена"; exit 0; }
          BODY="Деплой упал на \`${SHA:0:7}\`.
          Прод остался на предыдущей рабочей сборке (compose не заменяет контейнер при неудачной сборке).

          Лог: $RUN_URL

          Частая причина (уже ловили): VPN на self-hosted раннере → \`ssh: connect to host … port 22: Connection refused\`, сервер при этом жив. Проверка: \`Test-NetConnection 31.177.83.219 -Port 22\`. Лечение: выключить VPN и перезапустить джобу.
          Эта тревога закроется сама при следующем зелёном деплое."
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --body "$BODY" || echo "::warning::не удалось дописать в тревогу #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY" || echo "::warning::не удалось создать тревогу"
          fi

      # Зелёный деплой закрывает тревогу сам: иначе она живёт вечно и перестаёт
      # что-либо значить — а протухшая тревога хуже отсутствующей.
      - name: Снять тревогу — деплой прошёл
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: '🔴 Деплой на прод падает'
          SHA: ${{ github.sha }}
        run: |
          command -v gh >/dev/null || exit 0
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue close "$EXISTING" --comment "Деплой прошёл на \`${SHA:0:7}\` — прод снова свежий." || true
          fi
