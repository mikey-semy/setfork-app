name: Audit

# Аудит зависимостей: на PR/пуш в master + еженедельно (новые advisory всплывают
# и без изменений кода).
#
# БЛОКИРУЕТ то, что уезжает на прод: `--omit=dev`, планка high. Dev-цепочка
# (eslint → minimatch → brace-expansion, DoS при разворачивании скобок) печатается
# рядом, но PR не красит — это инструмент сборки, а не работающая служба, и лечится
# только мажорными апгрейдами линтера.
#
# Почему так: до 30.07 гейт блокировал на high ВКЛЮЧАЯ dev — и был красным на master
# месяцами. Вечно красный гейт не защищает, он приучает не смотреть: настоящую находку
# (postcss в next — XSS через неэкранированный </style> и чтение файлов через
# sourceMappingURL) в этом шуме никто бы не заметил. Её закрыли подъёмом postcss до
# 8.5.25 (тот же мажор), и теперь прод-часть чистая — а значит красный цвет снова
# означает «появилось что-то новое».
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 6 * * 1' # понедельник, еженедельно


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  npm-audit:
    runs-on: [self-hosted, setfork]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # cache: npm НЕ используем: на self-hosted раннере это скачивание архива
          # кэша из GitHub (из РФ — минуты на джобу). Вместо него ~/.npm смонтирован
          # персистентным томом раннера (setfork-ci-runner/docker-compose.yml), а
          # установка идёт --prefer-offline.
      # Прод-часть — гейт: красный означает «на прод уезжает уязвимость».
      - run: npm audit --omit=dev --audit-level=high
      # Dev-цепочка — только напечатать. Красить PR ей нельзя (см. шапку), но и
      # прятать нечего: разбор идёт еженедельным прогоном.
      - name: Dev-зависимости (не блокирует)
        run: |
          npm audit --audit-level=high || echo "::notice::в dev-зависимостях есть high — см. вывод выше; на прод они не уезжают"


  # Скан секретов в ИСТОРИИ коммитов (git-режим). Не --no-git: тот сканирует и .git/
  # (в CI там токен checkout'а → ложные срабатывания). git-режим смотрит содержимое
  # коммитов, не служебные файлы. Барьер против закоммиченного ключа/.env.
  secrets:
    runs-on: [self-hosted, setfork]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # полная история для скана
      # Рабочая копия заносится через `docker cp`, а НЕ bind-mount: раннер сам в
      # контейнере с проброшенным docker.sock, поэтому демон на ХОСТЕ монтировал бы
      # несуществующий путь (пустоту) — gitleaks не находил .gitleaks.toml и падал
      # с «unable to load gitleaks config». Тот же приём — в setfork-core/audit.yml.
      - name: gitleaks (secret scan)
        run: |
          docker rm -f "gl-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
          docker create --name "gl-${GITHUB_RUN_ID}" zricethezav/gitleaks:latest \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact --exit-code 1
          docker cp . "gl-${GITHUB_RUN_ID}:/repo"
          docker start -a "gl-${GITHUB_RUN_ID}"
      - name: cleanup
        if: always()
        run: docker rm -f "gl-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
