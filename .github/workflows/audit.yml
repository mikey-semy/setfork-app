name: Audit

# Аудит зависимостей: на PR/пуш в master + еженедельно (новые advisory всплывают
# и без изменений кода). Блокирует на high/critical; moderate (транзитивные dev/build,
# требуют мажорных апгрейдов) пока пропускаем — поднять планку отдельной задачей.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 6 * * 1' # понедельник, еженедельно

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm audit --audit-level=high

  # Скан секретов в дереве (не в истории — ловим впервые закоммиченный секрет). Сейчас
  # чисто; любой добавленный ключ/токен уронит проверку. Барьер против «залил .env/ключ».
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks (secret scan)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source=/repo --no-git --redact --exit-code 1
