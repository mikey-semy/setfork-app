name: Audit

# Аудит зависимостей: на PR/пуш в master + еженедельно (новые advisory всплывают
# и без изменений кода).
#
# БЛОКИРУЕТ то, что уезжает на прод: зависимости приложения (`--omit=dev`) И инструменты,
# которые прод-образ миграции реально запускает (scripts/audit-migrate-deps.mjs), планка
# high. Остальная dev-цепочка
# (eslint → minimatch → brace-expansion, DoS при разворачивании скобок) печатается
# рядом, но PR не красит — это инструмент сборки, а не работающая служба, и лечится
# только мажорными апгрейдами линтера.
#
# Почему так: до 30.07 гейт блокировал на high ВКЛЮЧАЯ dev — и был красным на master
# месяцами. Вечно красный гейт не защищает, он приучает не смотреть: настоящую находку
# (postcss в next — XSS через неэкранированный </style> и чтение файлов через
# sourceMappingURL) в этом шуме никто бы не заметил. Её закрыли подъёмом postcss до
# 8.5.25 (тот же мажор), и теперь прод-часть чистая — а значит красный цвет снова
# означает «появилось что-то новое».
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 6 * * 1' # понедельник, еженедельно


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Пол для всех джоб: без этой строки GITHUB_TOKEN приезжает с правами по
# умолчанию для репозитория (в том числе на запись). Кому нужно больше —
# объявляет у себя и перекрывает.
permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: [self-hosted, setfork]
    steps:
      # persist-credentials: false — иначе checkout кладёт GITHUB_TOKEN в
      # .git/config рабочей копии, а раннер общий и переиспользуемый: токен
      # доживает до чужих шагов и уезжает в артефакты. Ни один шаг здесь
      # git-кредами не пользуется. То же в остальных джобах и воркфлоу.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # cache: npm НЕ используем: на self-hosted раннере это скачивание архива
          # кэша из GitHub (из РФ — минуты на джобу). Вместо него ~/.npm смонтирован
          # персистентным томом раннера (setfork-ci-runner/docker-compose.yml), а
          # установка идёт --prefer-offline.
      # Прод-часть — гейт: красный означает «на прод уезжает уязвимость».
      - run: npm audit --omit=dev --audit-level=high
      # Инструменты миграции — ТОЖЕ гейт: tsx и drizzle-kit объявлены в devDependencies,
      # но образ `migrate` их запускает на проде, у боевой БД. Под `--omit=dev` они не
      # попадали (замечание авто-ревью #585).
      - run: node scripts/audit-migrate-deps.mjs
      # Остальная dev-цепочка — только напечатать. Красить PR ей нельзя (см. шапку), но и
      # прятать нечего: разбор идёт еженедельным прогоном.
      - name: Dev-зависимости (не блокирует)
        run: |
          npm audit --audit-level=high || echo "::notice::в dev-зависимостях есть high — см. вывод выше; на прод они не уезжают"


  # Скан секретов в ИСТОРИИ коммитов (git-режим). Не --no-git: тот сканирует и .git/
  # (в CI там токен checkout'а → ложные срабатывания). git-режим смотрит содержимое
  # коммитов, не служебные файлы. Барьер против закоммиченного ключа/.env.
  secrets:
    runs-on: [self-hosted, setfork]
    steps:
      # persist-credentials: false здесь особенно к месту: шаг ниже заносит в
      # контейнер gitleaks рабочую копию ЦЕЛИКОМ, вместе с .git — то есть вместе
      # с токеном, если его туда положить.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # полная история для скана
          persist-credentials: false
      # Рабочая копия заносится через `docker cp`, а НЕ bind-mount: раннер сам в
      # контейнере с проброшенным docker.sock, поэтому демон на ХОСТЕ монтировал бы
      # несуществующий путь (пустоту) — gitleaks не находил .gitleaks.toml и падал
      # с «unable to load gitleaks config». Тот же приём — в setfork-core/audit.yml.
      # Отчёт забирается ОБЯЗАТЕЛЬНО, и вот почему: сам gitleaks при падении печатает
      # только «leaks found: 1», без файла и строки. Такой красный не сообщает, что
      # чинить, — приходится воспроизводить скан у себя на клоне merge-коммита, чтобы
      # узнать адрес (так и было 28.08.2026). Значение остаётся скрытым: --redact
      # заменяет его на REDACTED и в отчёте тоже, поэтому в лог попадают правило,
      # файл, строка и коммит — ровно то, что нужно, и ничего сверх.
      # ДИАПАЗОН. На предложении сканируются коммиты, которые оно ДОБАВЛЯЕТ, а не вся
      # история: раннер свой, рабочая копия переиспользуется между прогонами, и в .git
      # остаются рефы чужих веток. Скан «протекал» — предложение краснело из-за находки
      # в СОСЕДНЕЙ ветке, которой в нём нет (так и было 28.08.2026: #829 покраснел из-за
      # коммита из #830, и числа коммитов расходились: 1136 против 1094). Полная история
      # при этом не остаётся без присмотра: на push в master диапазон пуст и скан идёт
      # целиком, то есть попадание чего угодно в master по-прежнему ловится.
      - name: диапазон скана
        id: range
        run: |
          opts=""
          # Сузить можно ТОЛЬКО если база достоверно известна. Не вышло достать её —
          # сканируем всё: лишняя работа безопаснее пропущенного секрета.
          if [ -n "${GITHUB_BASE_REF:-}" ] && git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"; then
            base="$(git rev-parse FETCH_HEAD)"
            # Под `set -e` проверка пишется через if: голое `cmd && x=y` уронило бы
            # шаг там, где задумано мягкое «не вышло — сканируем всё».
            if git cat-file -e "$base^{commit}" 2>/dev/null; then opts="--log-opts=$base..HEAD"; fi
          fi
          echo "opts=$opts" >> "$GITHUB_OUTPUT"
          echo "диапазон: ${opts:-вся история}"
      - name: gitleaks (secret scan)
        env:
          RANGE: ${{ steps.range.outputs.opts }}
        run: |
          docker rm -f "gl-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
          docker create --name "gl-${GITHUB_RUN_ID}" zricethezav/gitleaks:latest \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact --exit-code 1 \
            ${RANGE} \
            --report-format json --report-path /tmp/gitleaks.json
          docker cp . "gl-${GITHUB_RUN_ID}:/repo"
          docker start -a "gl-${GITHUB_RUN_ID}" && code=0 || code=$?
          if [ "$code" != "0" ]; then
            echo "::group::найденные места"
            docker cp "gl-${GITHUB_RUN_ID}:/tmp/gitleaks.json" - 2>/dev/null \
              | tar -xO 2>/dev/null \
              | python3 -c "import json,sys; [print(x['RuleID'], x['File'] + ':' + str(x['StartLine']), 'коммит', x['Commit'][:8]) for x in json.load(sys.stdin)]" \
              || echo "отчёт забрать не удалось — воспроизводи скан на клоне merge-коммита"
            echo "::endgroup::"
          fi
          exit "$code"
      - name: cleanup
        if: always()
        run: docker rm -f "gl-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true

  # Аудит САМИХ воркфлоу (zizmor): инъекция в `run:` через подконтрольные поля
  # события, лишние права GITHUB_TOKEN, токен, осевший в .git/config, экшены на
  # подвижной ссылке. У нас это не абстракция: раннер свой, у него docker.sock
  # ХОСТА и ключ выкатки на прод — цена чужого кода в шаге здесь выше, чем на
  # одноразовой машине GitHub. Правила и политика закрепления — .github/zizmor.yml.
  # Такая же джоба стоит в setfork-core.
  #
  # Гейт настоящий, не «печатаем и идём дальше»: на момент подключения находок
  # ноль, поэтому красный цвет означает ровно «в воркфлоу завелось новое».
  workflows:
    runs-on: [self-hosted, setfork]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Образ с GHCR, а не pip: у раннера python 3.8, а zizmor новее 1.2 требует
      # 3.10+ — pip там молча подсовывает версию годичной давности (проверено
      # прогоном в setfork-core). Релиз-бинарь с GitHub и официальный экшен
      # отпадают по другой причине: они тянут release-assets.githubusercontent.com,
      # которые у нас рвутся DPI.
      #
      # Дальше — тот же приём, что с gitleaks выше: контейнер создаётся, дерево
      # заносится `docker cp` (bind-mount из sibling-демона монтировал бы пустоту),
      # `docker start -a` отдаёт код возврата контейнера — 0 без находок, 11..14
      # с находками, то есть гейт получается без единой строки условий.
      # Заносим ТОЛЬКО .github: остальное дерево и .git аудиту не нужны.
      #
      # Версия образа закреплена: линтер, который сам приносит новые правила,
      # красил бы PR без единой правки воркфлоу. Обновлять сознательно.
      #
      # --offline: без него zizmor ходит в API GitHub за метаданными экшенов —
      # лишняя сетевая зависимость и лимиты на канале, который и так шейпится.
      # --format github: находки приезжают аннотациями к строкам воркфлоу.
      - name: zizmor (аудит воркфлоу)
        run: |
          docker rm -f "zz-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/zz"
          mkdir -p "$RUNNER_TEMP/zz"
          cp -r .github "$RUNNER_TEMP/zz/"
          # Тянем с ЧИСТЫМ docker-конфигом: останься в конфиге раннера протухший
          # логин в ghcr.io от прошлой выкатки — даже публичный образ ответил бы
          # «denied» (так упал первый прогон этой джобы в setfork-core, где
          # docker logout после пуша не стоял).
          ZZ_CFG=$(mktemp -d)
          DOCKER_CONFIG="$ZZ_CFG" docker pull --quiet ghcr.io/zizmorcore/zizmor:1.29.0 >/dev/null
          rm -rf "$ZZ_CFG"
          docker create --name "zz-${GITHUB_RUN_ID}" ghcr.io/zizmorcore/zizmor:1.29.0 \
            --offline --no-progress --format github --config /repo/.github/zizmor.yml /repo >/dev/null
          docker cp "$RUNNER_TEMP/zz/." "zz-${GITHUB_RUN_ID}:/repo"
          docker start -a "zz-${GITHUB_RUN_ID}"
      - name: cleanup
        if: always()
        run: docker rm -f "zz-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
